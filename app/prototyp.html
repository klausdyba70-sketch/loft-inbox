<title>Loft Inbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: Desktop = Leiste | Liste | Verlauf. Mobil = eine Ansicht, Tabs unten. Kobaltblau als Leitfarbe, Violett für alles, was die KI macht. */
:root{
  --bg:#f3f4f8;--surface:#ffffff;--sunk:#eceef4;--line:#e2e4ec;--ink:#151826;--mute:#7c8196;--soft:#4a4f63;
  --primary:#2b4fe0;--primary-soft:#e8edff;--on-primary:#ffffff;
  --ai:#6d3fd6;--ai-soft:#f1ebff;--ai-line:#ddd0fb;
  --bubble-out:#2b4fe0;--on-out:#ffffff;
  --red:#e5484d;--red-soft:#fdecec;--orange:#e08a00;--orange-soft:#fff3dc;--green:#1f9d5c;--green-soft:#e3f6eb;
  --blue:#2b4fe0;--violet:#8e4ec6;--grey-soft:#eceef4;
  --font:"Geist",system-ui,-apple-system,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
  --r:14px;--g:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1117;--surface:#171a22;--sunk:#20232d;--line:#2a2e3a;--ink:#eceef4;--mute:#8a8fa3;--soft:#b6bacb;
  --primary:#6f8cff;--primary-soft:#1e2647;--on-primary:#0f1117;--ai:#b79bff;--ai-soft:#251d3d;--ai-line:#3b2f63;
  --bubble-out:#2f45a8;--on-out:#ffffff;--red-soft:#3a1d20;--orange-soft:#3a2c12;--green-soft:#15322a;--grey-soft:#262a35;--blue:#6f8cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--surface:#171a22;--sunk:#20232d;--line:#2a2e3a;--ink:#eceef4;--mute:#8a8fa3;--soft:#b6bacb;
  --primary:#6f8cff;--primary-soft:#1e2647;--on-primary:#0f1117;--ai:#b79bff;--ai-soft:#251d3d;--ai-line:#3b2f63;
  --bubble-out:#2f45a8;--on-out:#ffffff;--red-soft:#3a1d20;--orange-soft:#3a2c12;--green-soft:#15322a;--grey-soft:#262a35;--blue:#6f8cff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);margin:0;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
mark{background:#ffe27a;color:#151826;border-radius:3px;padding:0 1px}
.app{height:100%;display:grid;grid-template-columns:76px 380px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}

/* Navigation */
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;border-right:1px solid var(--line);background:var(--surface)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;margin-bottom:14px}
.nav{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:8px 0;border-radius:12px;color:var(--mute);font-size:11px;font-weight:500}
.nav svg{width:22px;height:22px}
.nav[aria-current="page"]{color:var(--primary);background:var(--primary-soft)}
.nav .cnt{position:absolute;top:3px;right:9px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:600 10px/17px var(--font);padding:0 4px}

/* Liste */
.list{background:var(--surface);border-right:1px solid var(--line)}
.lh{display:flex;align-items:flex-end;gap:12px;padding:18px var(--gr) 10px var(--g)}
.lh h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.lh p{margin:3px 0 0;color:var(--mute);font-size:13px}
.lh .sp{flex:1}
.hot{color:var(--red);font-weight:600}
.ghost{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap;background:var(--surface)}
.search{padding:0 var(--gr) 10px var(--g);display:flex;gap:8px}
.sbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--sunk);border:1px solid transparent}
.sbox:focus-within{border-color:var(--primary);background:var(--surface)}
.sbox svg{width:18px;height:18px;color:var(--mute);flex:none}
.sbox input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.sbox input::placeholder{color:var(--mute)}
.sbox .clr{color:var(--mute);font-size:18px;line-height:1;width:24px}
.fbtn{position:relative;width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--soft);flex:none}
.fbtn svg{width:18px;height:18px}
.fbtn.on{background:var(--primary-soft);color:var(--primary)}
.fbtn .cnt{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--primary);color:var(--on-primary);font:600 10px/17px var(--font)}
.asks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 var(--gr) 10px var(--g)}
.asks::-webkit-scrollbar{display:none}
.asks button{flex:none;height:30px;padding:0 11px;border-radius:99px;background:var(--ai-soft);color:var(--ai);font-size:12.5px;font-weight:500;white-space:nowrap}
.filters{display:flex;gap:6px;overflow-x:auto;padding:0 var(--gr) 12px var(--g);scrollbar-width:none;border-bottom:1px solid var(--line)}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;border-radius:99px;background:var(--sunk);font-size:13px;font-weight:500;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.chip .n{font:12px var(--mono);margin-left:5px;opacity:.65}
.rows{flex:1;overflow-y:auto;overscroll-behavior:contain}
.answer{margin:12px var(--gr) 4px var(--g);background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:var(--r);padding:12px 14px;font-size:14px}
.answer .ah{display:flex;align-items:center;gap:6px;color:var(--ai);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.answer .ah svg{width:14px;height:14px}
.answer p{margin:0 0 6px}
.answer .src{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.answer .src button{height:28px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--ai-line);font-size:12.5px;color:var(--ai);font-weight:500}
.rcount{padding:10px var(--gr) 2px var(--g);font-size:12px;color:var(--mute)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;width:100%;text-align:left;padding:13px var(--gr) 13px var(--g);border-bottom:1px solid var(--line)}
.row[aria-current="true"]{background:var(--primary-soft)}
.av{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.av .mk{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--c);border:2.5px solid var(--surface)}
.row[aria-current="true"] .av .mk{border-color:var(--primary-soft)}
.rc{min-width:0;display:flex;flex-direction:column;gap:2px}
.r1{display:flex;gap:8px;align-items:baseline}
.r1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row.unread .r1 b{font-weight:700}
.r1 time{font:12px var(--mono);color:var(--mute);flex:none}
.row.unread .r1 time{color:var(--primary);font-weight:500}
.r2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft);font-size:14px}
.row.unread .r2{color:var(--ink);font-weight:500}
.r2s{font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r3{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);min-width:0;overflow:hidden;white-space:nowrap;margin-top:3px}
.st{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;flex:none}
.st-offen{background:var(--orange-soft);color:var(--orange)}
.st-beantwortet{background:var(--primary-soft);color:var(--primary)}
.st-gebucht{background:var(--green-soft);color:var(--green)}
.st-abgeschlossen{background:var(--grey-soft);color:var(--mute)}
.st-spam{background:var(--red-soft);color:var(--red)}
.st-hot{background:var(--red-soft);color:var(--red)}
.star{color:var(--orange)}
.empty{margin:auto;text-align:center;color:var(--mute);padding:40px 24px;max-width:340px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* Verlauf */
.detail{background:var(--bg)}
.dh{display:flex;align-items:center;gap:6px;padding:10px var(--gr) 10px var(--g);background:var(--surface);border-bottom:1px solid var(--line);min-height:60px}
.icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--soft)}
.icon:hover{background:var(--sunk)}
.icon svg{width:20px;height:20px}
.icon.star-on{color:var(--orange)}
.icon.done-on{color:var(--green)}
.back{display:none}
.dh .av{width:36px;height:36px;font-size:13px}
.dh-t{flex:1;min-width:0;margin-left:4px}
.dh-t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh-t small{display:block;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dscroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px var(--gr) 24px var(--g)}
.dinner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.dinner h2{font-size:21px;font-weight:650;letter-spacing:-.015em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--soft)}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sum{background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:var(--r);padding:14px 16px;font-size:15px;line-height:1.5}
.sum .ah{display:flex;align-items:center;gap:6px;color:var(--ai);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.sum .ah svg{width:15px;height:15px}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.vbar span{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.seg{display:flex;gap:2px;background:var(--sunk);border-radius:10px;padding:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:28px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--soft);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.1)}
.msgs{display:flex;flex-direction:column;gap:10px}
/* Chat */
.bub{max-width:min(540px,88%);padding:10px 14px;border-radius:18px;white-space:pre-wrap;font-size:14.5px;overflow-wrap:anywhere}
.bub.in{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.bub.out{background:var(--bubble-out);color:var(--on-out);align-self:flex-end;border-bottom-right-radius:6px}
.bub small{display:block;font:11px var(--mono);opacity:.6;margin-top:5px}
.typing{color:var(--mute)}
.typing i{animation:blink 1.2s infinite;font-style:normal}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
/* E-Mail */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mail.first{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.mhead{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px}
.mhead .av{width:34px;height:34px;font-size:12px}
.mmeta{flex:1;min-width:0}
.mmeta .n{display:flex;gap:8px;align-items:baseline}
.mmeta .n b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mmeta .n time{margin-left:auto;font:12px var(--mono);color:var(--mute);flex:none}
.mmeta .to{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mmeta .pv{font-size:13.5px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.tagfirst{display:inline-block;font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:1px 7px;margin-top:4px}
.mbody{padding:0 14px 14px 58px;white-space:pre-wrap;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.msig{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--mute);white-space:pre-wrap}
.qbtn{margin-top:10px;height:22px;padding:0 8px;border-radius:6px;background:var(--sunk);color:var(--mute);font-size:12px;letter-spacing:.1em}
.quote{margin-top:8px;padding:6px 0 6px 12px;border-left:3px solid var(--line);color:var(--mute);font-size:13px;white-space:pre-wrap}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.att{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;background:var(--sunk);font-size:12.5px;color:var(--soft);max-width:100%}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .ic{flex:none;font:600 9.5px var(--mono);background:var(--red);color:#fff;border-radius:3px;padding:1px 4px}
.att .ic.img{background:var(--green)}
.bub .att{background:rgb(255 255 255/.16);color:inherit}

/* Antwort */
.composer{background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gr) 12px var(--g)}
.cinner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ctop{display:flex;align-items:center;gap:8px;min-width:0}
.ailbl{font-size:12px;color:var(--ai);font-weight:600;flex:none;display:flex;align-items:center;gap:4px}
.ailbl svg{width:14px;height:14px}
.ctop .seg{background:var(--ai-soft)}
.ctop .seg button{color:var(--ai)}
.ctop .seg button[aria-pressed="true"]{color:var(--ink)}
.src-note{font-size:11.5px;color:var(--mute);margin-left:auto;flex:none}
textarea{width:100%;min-height:110px;max-height:32vh;resize:vertical;font-size:14.5px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink)}
.catt{display:flex;flex-wrap:wrap;gap:6px}
.catt .att button{color:var(--mute);font-size:15px;line-height:1;margin-left:2px}
.sugg{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px dashed var(--ai-line);color:var(--ai);font-size:12.5px;font-weight:500}
.cbar{display:flex;align-items:center;gap:8px;min-width:0}
.clip{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--soft)}
.clip svg{width:19px;height:19px}
.refine{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.refine::-webkit-scrollbar{display:none}
.refine button{flex:none;height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;color:var(--soft);white-space:nowrap}
.send{flex:none;height:38px;padding:0 18px;border-radius:11px;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:14px}
.closed{display:flex;align-items:center;gap:12px;justify-content:space-between;color:var(--soft);font-size:14px;flex-wrap:wrap}

/* Statistik */
.stats{grid-column:2/4;overflow-y:auto;padding:20px var(--gr) 32px var(--g)}
.sinner{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.stats h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mute);font-size:13px;margin:-8px 0 4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--mute);margin-top:4px}
.kpi.k1 .v{color:var(--primary)}.kpi.k2 .v{color:var(--orange)}.kpi.k4 .v{color:var(--green)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:13.5px;font-weight:600;margin:0 0 12px}
.bar{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 2em;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.num{font:12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .num{margin-left:auto}
.lg{width:9px;height:9px;border-radius:3px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--soft)}
.rules li{display:flex;gap:10px;justify-content:space-between}
.rules b{font-weight:600;flex:none}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgb(10 12 20/.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:10px var(--gr) calc(20px + env(safe-area-inset-bottom,0px)) var(--g);display:flex;flex-direction:column;gap:6px;max-height:88vh;overflow-y:auto}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sheet h2{font-size:18px;margin:0 0 4px}
.sheet h3{font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:10px;background:var(--sunk);font-size:14px}
.opt[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
.opt .d{width:9px;height:9px;border-radius:50%;background:var(--c)}
.sbtn{margin-top:14px;height:44px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:600}
.sbtn.danger{background:var(--red-soft);color:var(--red)}
.sbtn.sec{background:var(--sunk);color:var(--ink);margin-top:6px}
.doclist{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sunk);text-align:left;width:100%}
.doc[aria-pressed="true"]{background:var(--primary-soft);box-shadow:inset 0 0 0 1.5px var(--primary)}
.doc .ic{flex:none;width:34px;height:42px;border-radius:5px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:end center;padding-bottom:5px;font:600 9px var(--mono);color:var(--red)}
.doc b{display:block;font-size:14px;font-weight:500;overflow-wrap:anywhere}
.doc small{display:block;font-size:12px;color:var(--mute)}
.doc .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--on-primary);font-size:12px;flex:none}
.doc[aria-pressed="true"] .ck,.img[aria-pressed="true"] .ck{background:var(--primary);border-color:var(--primary)}

  .cards{grid-template-columns:minmax(0,1fr)}

/* Kalender */
:root{--sP:#2b4fe0;--sF:#0e9bb5}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.sdot.sP{background:var(--sP)}.sdot.sF{background:var(--sF)}
.cal{grid-column:2/4;overflow-y:auto;padding:20px var(--gr) 32px var(--g)}
.cinner2{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px 20px;align-items:start}
.calh,.calbar{grid-column:1/-1}
.calh h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.sync{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:12.5px;margin:4px 0 0}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mnav{display:flex;align-items:center;gap:4px}
.mnav b{font-size:17px;font-weight:600;min-width:9.5em;text-align:center;text-transform:capitalize}
.icon.flip svg{transform:scaleX(-1)}
.calwrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;min-width:0}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11.5px;font-weight:600;color:var(--mute);text-align:center;padding:4px 0 6px;letter-spacing:.04em}
.cd{min-height:92px;border-radius:12px;padding:7px 6px 6px;display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--bg);min-width:0;transition:background .15s}
.cd:hover{background:var(--sunk)}
.cd.pad{background:none}
.cd.we{background:color-mix(in srgb,var(--bg) 60%,var(--sunk))}
.cd.past{opacity:.45}
.cd .dn{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cd.today .dn{background:var(--primary);color:var(--on-primary)}
.cd.sel{background:var(--primary-soft);box-shadow:inset 0 0 0 1.5px var(--primary)}
.bars{display:flex;flex-direction:column;gap:3px;margin-top:auto;min-width:0}
.cb{display:block;height:18px;border-radius:5px;font-size:10.5px;line-height:18px;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.cb em{font-style:normal;font-weight:500}
.cb.free{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cb.gebucht.sP{background:var(--sP);color:#fff}.cb.gebucht.sF{background:var(--sF);color:#fff}
.cb.reserviert.sP{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--sP) 22%,var(--surface)) 0 5px,color-mix(in srgb,var(--sP) 10%,var(--surface)) 5px 10px);color:var(--sP);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sP) 45%,transparent)}
.cb.reserviert.sF{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--sF) 22%,var(--surface)) 0 5px,color-mix(in srgb,var(--sF) 10%,var(--surface)) 5px 10px);color:var(--sF);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sF) 45%,transparent)}
.cb.block{background:repeating-linear-gradient(45deg,var(--sunk) 0 4px,var(--line) 4px 8px);color:var(--mute)}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--soft);margin-top:12px;padding:0 4px}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.lgb{display:inline-block;width:18px;height:10px;border-radius:3px}
.lgb.solid{background:var(--soft)}
.lgb.stripe{background:repeating-linear-gradient(135deg,var(--line) 0 3px,var(--surface) 3px 6px);box-shadow:inset 0 0 0 1px var(--mute)}
.lgb.blk{background:repeating-linear-gradient(45deg,var(--sunk) 0 3px,var(--line) 3px 6px)}
.calside{display:flex;flex-direction:column;gap:14px;min-width:0}
.dayd,.agenda{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.dayd h3,.agenda h3{font-size:15px;font-weight:650;margin:0 0 10px}
.dd-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.dd-t{flex:1;min-width:0}
.dd-t b{display:block;font-weight:600;font-size:14px}
.dd-t small{display:block;font-size:12.5px;color:var(--mute)}
.dd-t small.ok{color:var(--green);font-weight:600}
.mini{height:30px;padding:0 11px;border-radius:9px;background:var(--sunk);font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;flex:none}
.mini.pri{background:var(--primary);color:var(--on-primary)}
.ag{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 0;border-top:1px solid var(--line)}
.agd{width:36px;text-align:center;flex:none}
.agd b{display:block;font-size:17px;line-height:1.1}
.agd small{font-size:11px;color:var(--mute)}
.ag-t{min-width:0;flex:1}
.ag-t b{display:block;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-t small{display:block;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Verfügbarkeit im Verlauf */
.avail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.avh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.avh svg{width:15px;height:15px}
.link{margin-left:auto;color:var(--primary);font-size:12.5px;font-weight:600;text-transform:none;letter-spacing:0}
.av-row{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:14px}
.av-row b{font-weight:600}
.av-row small{font-size:11.5px;color:var(--primary);background:var(--primary-soft);border-radius:5px;padding:1px 6px}
.av-row .sp{flex:1}
.av-st{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px}
.av-st.free,.av-st.mine{background:var(--green-soft);color:var(--green)}
.av-st.gebucht{background:var(--red-soft);color:var(--red)}
.av-st.reserviert{background:var(--orange-soft);color:var(--orange)}
.av-st.block{background:var(--grey-soft);color:var(--mute)}
.av-who{font-size:12.5px;color:var(--mute);margin:-4px 0 4px 17px}
.av-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.alt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--soft)}
.av-note{margin:8px 0 0;font-size:12.5px;color:var(--ai)}
.from{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.from b{color:var(--soft);font-weight:600}
@media (max-width:1050px){.cinner2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .cal{grid-column:1}
  .calwrap{padding:8px;border-radius:14px}

:root[data-theme="dark"]{--sP:#6f8cff;--sF:#2cc4dd}

/* Punkte + 6-Monats-Übersicht */
.dt{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.dt.sP.gebucht{background:var(--sP)}.dt.sF.gebucht{background:var(--sF)}
.dt.sP.reserviert{box-shadow:inset 0 0 0 1.6px var(--sP)}.dt.sF.reserviert{box-shadow:inset 0 0 0 1.6px var(--sF)}
.dt.block{background:var(--mute);opacity:.45}
.legend2 .dt{width:9px;height:9px}
.calh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cinner2.wide{grid-template-columns:minmax(0,1fr)}
.mms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mm{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.mmh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.mmh b{font-size:15px;font-weight:650;text-transform:capitalize}
.mmh small{font-size:11.5px;color:var(--mute)}
.mmg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mw{font-size:10.5px;color:var(--mute);text-align:center;padding-bottom:4px}
.md{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border-radius:8px;font-size:12.5px}
.md:hover{background:var(--sunk)}
.md.past{opacity:.4}
.md.today>span:first-child{background:var(--primary);color:var(--on-primary);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-weight:600}
.dts{display:flex;gap:2px;height:7px}
@media (max-width:760px){
  .bars{flex-direction:row;justify-content:center;gap:3px;margin-top:auto}
  .cb{width:7px;height:7px;border-radius:50%}
  .cb.free{display:none}
  .cb.reserviert.sP{background:none;box-shadow:inset 0 0 0 1.6px var(--sP)}
  .cb.reserviert.sF{background:none;box-shadow:inset 0 0 0 1.6px var(--sF)}

  .cd{min-height:50px;align-items:center}
  .mms{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* Einstellungen */
body:not([data-view="set"]) .set{display:none}
.set{grid-column:2/4;overflow-y:auto;padding:20px var(--gr) 32px var(--g)}
.set .sinner{max-width:680px}
.set h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px}
.scard h3{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 2px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.scard h3+.srow{border-top:0}
.srow.col{flex-direction:column;align-items:stretch;gap:8px}
.srow textarea{min-height:70px}
.stx{flex:1;min-width:0}
.stx b{display:block;font-weight:500;font-size:14.5px}
.stx small{display:block;font-size:12.5px;color:var(--mute)}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"] i{transform:translateX(18px)}
.cst{font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;flex:none}
.cst.ok{background:var(--green-soft);color:var(--green)}
.cst.todo{background:var(--orange-soft);color:var(--orange)}
@media (max-width:760px){.set{grid-column:1}.nav{font-size:10.5px}.srow{flex-wrap:wrap}}

.ghost.sq{width:34px;padding:0;font-size:20px;line-height:1}

.tfil button{display:flex;align-items:center;gap:7px;height:40px;padding:0 10px;border-radius:12px;background:var(--sunk);color:var(--soft);font-size:13px;font-weight:500;min-width:0}
.tfil svg{width:18px;height:18px;flex:none}

.tfil button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
.tfil button:first-child svg{color:var(--primary)}
.grp{display:flex;align-items:center;gap:8px;padding:14px var(--gr) 6px var(--g);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}

.ctag{font-size:10.5px;font-weight:600;color:var(--violet);background:color-mix(in srgb,var(--violet) 12%,var(--surface));border-radius:5px;padding:1px 6px;flex:none}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 14px}
.kv{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;min-width:0}
.kv:first-child{border-top:0}
.kv span{color:var(--mute);width:5.5em;flex:none;font-size:13px}
.kv b{font-weight:500;flex:1;min-width:0;overflow-wrap:anywhere}
.sechd{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.sechd h3,.sh{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:6px 0 0}
.upl{display:inline-flex;align-items:center;cursor:pointer}
.dseg{align-self:flex-start;max-width:100%}

.drow:first-child{border-top:0}

.crow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.chev{font-size:22px;color:var(--mute);line-height:1}

  summary:'Fashion-Lookbook am Sa 14.11., 9 bis 19 Uhr, 8 Personen. Offene Fragen: Verfügbarkeit, Tageslicht, Make-up-Raum, Parken für einen Sprinter.',

        {d:'out',t:h(29.3),x:'Hallo Herr Brandt,\n\nvielen Dank für Ihre Anfrage. Das Factory Loft passt sehr gut: 4 Tische à 4 Personen und 16 Stühle, also genau Ihre Gruppengröße. Eigenes Catering ist problemlos möglich.\n\nEnde Januar sind noch mehrere Termine frei. Sobald Sie mir die genauen Tage nennen, schicke ich Ihnen das Angebot.\n\nViele Grüße\nKlaus\nLoft Studio Cologne'}]},

function calClick(b){

  if(b.dataset.day){selDay=b.dataset.day;if(b.dataset.tomonth)calMode='month';const d=pkey(selDay);calMonth=new Date(d.getFullYear(),d.getMonth(),1);render();return true;}
  if(b.dataset.block){bookings.push({s:b.dataset.block,d:selDay,type:'block',title:'Von dir geblockt',who:''});toast(`${STUDIO[b.dataset.block]} am ${fmtDay(selDay)} geblockt`);render();return true;}
  if(b.dataset.unblock){bookings=bookings.filter(x=>!(x.s===b.dataset.unblock&&x.d===selDay&&x.type==='block'));toast('Wieder freigegeben');render();return true;}
  if(b.dataset.showcal||b.dataset.altday){const k=b.dataset.showcal||b.dataset.altday;selDay=k;const d=pkey(k);calMonth=new Date(d.getFullYear(),d.getMonth(),1);view='cal';document.body.classList.remove('open');render();return true;}
  const t=threads.find(x=>x.id===currentId);
  if(b.dataset.reserve&&t){bookings.push({s:t.req.s,d:t.req.d,from:'09:00',to:'18:00',type:'reserviert',who:t.name,title:t.cat,tid:t.id});toast(`${STUDIO[t.req.s]} am ${fmtDay(t.req.d)} für ${first(t)} reserviert`);render();return true;}
  if(b.dataset.confirm&&t){const x=bookingOf(t.req.s,t.req.d);x.type='gebucht';t.status='gebucht';t.color='gruen';toast('Als gebucht eingetragen');render();return true;}
  if(b.dataset.release&&t){bookings=bookings.filter(x=>!(x.tid===t.id&&x.d===t.req.d&&x.s===t.req.s));toast('Termin freigegeben');render();return true;}
  return false;
}
function syncBookingOnFinal(t){
  if(!t.req||t.status!=='gebucht')return;
  const x=bookingOf(t.req.s,t.req.d);
  if(x&&x.tid===t.id)x.type='gebucht';
  else if(!x)bookings.push({s:t.req.s,d:t.req.d,from:'09:00',to:'18:00',type:'gebucht',who:t.name,title:t.cat,tid:t.id});
}

   <div class="dh-t"><b>${esc(t.name)}</b><small>${esc(t.email)}</small></div>
   <button class="icon ${t.star?'star-on':''}" id="star" aria-label="Wichtig" title="Wichtig">${I.star(t.star)}</button>
   <button class="icon ${t.status==='abgeschlossen'?'done-on':''}" id="done" aria-label="${t.status==='abgeschlossen'?'Wieder öffnen':'Abschließen'}" title="${t.status==='abgeschlossen'?'Wieder öffnen':'Abschließen'}">${I.done}</button>
   <button class="icon" id="more" aria-label="Optionen">${I.more}</button></header>
  <div class="dscroll" id="dscroll"><div class="dinner">
   <h2>${esc(t.subject)}</h2>
   <div class="pills">${stPill(t)}${t.prio==='hoch'&&t.status==='offen'?'<span class="st st-hot">Dringend</span>':''}${t.color?`<span class="pill"><span class="d" style="--c:${COLORS[t.color]}"></span>${COLOR_NAMES[t.color]}</span>`:''}<span class="pill">${STUDIO[t.studio]}</span><span class="pill">${t.cat}</span>${t.status==='spam'?`<span class="pill">Spam-Wert ${t.spam} %</span>`:''}</div>
   <div class="sum"><div class="ah">${I.spark}Zusammenfassung</div>${esc(t.summary)}</div>
   ${availHTML(t)}
   ${contactRowHTML(t)}
   <div class="vbar"><span>Verlauf · ${t.msgs.length} ${t.msgs.length===1?'Nachricht':'Nachrichten'}</span><div class="seg" role="group" aria-label="Ansicht"><button data-mv="mail" aria-pressed="${mailView==='mail'}">E-Mail</button><button data-mv="chat" aria-pressed="${mailView==='chat'}">Chat</button></div></div>
   <div class="msgs">${mailView==='mail'?mailHTML(t):chatHTML(t)}</div>
  </div></div>
  <footer class="composer"><div class="cinner">${closed?`<div class="closed"><span>${t.status==='spam'?'Als Spam aussortiert.':'Abgeschlossen. Taucht nicht mehr unter Alle auf.'}</span><button class="ghost" id="${t.status==='spam'?'spam':'done'}">${t.status==='spam'?'Kein Spam':'Wieder öffnen'}</button></div>`:`
   <div class="ctop"><span class="ailbl">${I.spark}KI</span><div class="seg" role="group" aria-label="Vorschläge">${D.map((d,i)=>`<button data-v="${i}" aria-pressed="${i===variantIdx}">${d[0]}</button>`).join('')}</div><span class="src-note">Infos aus Notion</span></div>
   ${att.length||sugg?`<div class="catt">${att.map(id=>attChip(docName(id),id)).join('')}${sugg?`<button class="sugg" data-addatt="${sugg}">${I.spark.replace('<svg','<svg width="13" height="13"')} ${docName(sugg).replace('_',' ').replace('.pdf','')} anhängen?</button>`:''}</div>`:''}
   <div class="from">Von <b>${MAILBOX}</b> an ${esc(t.email)}</div>
   <textarea id="draft" aria-label="Antwort">${esc(drafts[t.id])}</textarea>
   <div class="cbar"><button class="clip" id="openatt" aria-label="Anhang">${I.clip}</button><div class="refine"><button data-i="kurz">Kürzer</button><button data-i="sie">Sie-Form</button><button data-i="besicht">+ Besichtigung</button><button data-i="rechnung">+ Zahlung</button></div><button class="send" id="send">Senden</button></div>`}
  </div></footer>`;
}
function sheetHTML(){
  const t=threads.find(x=>x.id===currentId);
  const opt=(k,v,label,dot)=>`<button class="opt" data-flt="${k}" data-val="${v}" aria-pressed="${flt[k]==v}">${dot?`<span class="d" style="--c:${dot}"></span>`:''}${label}</button>`;
  let inner='';
  if(sheet==='import'){inner=importSheetHTML();}
  else if(sheet==='filter'){
    const cats=[...new Set(threads.map(x=>x.cat))];
    inner=`<h2>Filter</h2>
    <h3>Studio</h3><div class="opts">${opt('studio','P','Penthouse')}${opt('studio','F','Factory')}${opt('studio','X','Nicht festgelegt')}</div>
    <h3>Art der Anfrage</h3><div class="opts">${cats.map(c=>opt('cat',c,c)).join('')}</div>
    <h3>Markierung</h3><div class="opts">${Object.keys(COLORS).map(c=>opt('color',c,COLOR_NAMES[c],COLORS[c])).join('')}</div>
    <h3>Zeitraum</h3><div class="opts">${opt('range',1,'Heute')}${opt('range',7,'7 Tage')}${opt('range',30,'30 Tage')}</div>
    <button class="sbtn" id="closesheet">Fertig</button><button class="sbtn sec" id="resetflt">Zurücksetzen</button>`;
  } else if(sheet==='attach'){
    inner=`<h2>Anhang hinzufügen</h2>
    <div class="seg" role="group" style="align-self:flex-start"><button data-tab="docs" aria-pressed="${sheetTab==='docs'}">Fact Sheets & PDFs</button><button data-tab="imgs" aria-pressed="${sheetTab==='imgs'}">Loft-Bilder</button></div>
    ${sheetTab==='docs'?`<div class="notion" style="margin-top:8px"><i></i>Mit Notion synchronisiert · heute 06:00. Preise änderst du nur dort.</div>
    <div class="doclist" style="margin-top:6px">${DOCS.map(d=>`<button class="doc" data-pick="${d.id}" aria-pressed="${pick.includes(d.id)}"><span class="ic">PDF</span><span><b>${d.name}</b><small>${d.meta}</small></span><span class="ck">✓</span></button>`).join('')}</div>`:
    `<div class="imgs" style="margin-top:8px">${IMGS.map(d=>`<button class="img" data-pick="${d.id}" aria-pressed="${pick.includes(d.id)}" aria-label="${d.name}"><span class="ph" style="background:${d.bg}"></span><span>${d.name}</span><b class="ck">${pick.includes(d.id)?'✓':''}</b></button>`).join('')}</div><p class="hint">Platzhalter. In der echten Version deine Fotos aus einem festen Ordner.</p>`}
    <button class="sbtn" id="applyatt">${pick.length?`${pick.length} anhängen`:'Fertig'}</button>`;
  } else if(sheet==='more'&&t){
    const o=(attr,v,on,label,dot)=>`<button class="opt" data-${attr}="${v}" aria-pressed="${on}">${dot?`<span class="d" style="--c:${dot}"></span>`:''}${label}</button>`;
    inner=`<h2>Anfrage</h2>
    <h3>Markierung</h3><div class="opts">${Object.keys(COLORS).map(c=>o('c',c,t.color===c,COLOR_NAMES[c],COLORS[c])).join('')}${o('c','none',!t.color,'Keine')}</div>
    <h3>Studio</h3><div class="opts">${o('s','P',t.studio==='P','Penthouse')}${o('s','F',t.studio==='F','Factory')}${o('s','X',t.studio==='X','Nicht festgelegt')}</div>
    <h3>Priorität</h3><div class="opts">${['hoch','normal','niedrig'].map(p=>o('p',p,t.prio===p,p[0].toUpperCase()+p.slice(1))).join('')}</div>
    <button class="sbtn sec" id="done">${t.status==='abgeschlossen'?'Wieder öffnen':'Abschließen'}</button>
    <button class="sbtn danger" id="spam" style="margin-top:6px">${t.status==='spam'?'Kein Spam':'Als Spam markieren'}</button>`;
  }
  return `<div class="scrim" id="scrim"><div class="sheet" role="dialog"><div class="grab"></div>${inner}</div></div>`;
}
function statsHTML(){
  const real=threads.filter(t=>t.status!=='spam');
  const cats={}; real.forEach(t=>cats[t.cat]=(cats[t.cat]||0)+1);
  const cmax=Math.max(...Object.values(cats));
  const f=real.filter(t=>t.studio==='F').length,p=real.filter(t=>t.studio==='P').length,x=real.filter(t=>t.studio==='X').length;
  const resp=threads.filter(t=>t.resp); const avg=Math.round(resp.reduce((a,t)=>a+t.resp,0)/resp.length);
  const open=real.filter(t=>t.status==='offen').length, booked=real.filter(t=>t.status==='gebucht').length;
  const pct=n=>Math.round(n/real.length*100);
  const buckets=[['unter 1 h',0,60,'var(--green)'],['1 bis 4 h',60,240,'var(--orange)'],['über 4 h',240,1e9,'var(--red)']];
  const stc={offen:'var(--orange)',beantwortet:'var(--primary)',gebucht:'var(--green)',abgeschlossen:'var(--mute)'};
  return `<div class="sinner"><h1>Statistik</h1><p class="sub">Letzte 30 Tage · Beispieldaten</p>
  <div class="kpis"><div class="kpi k1"><div class="v">${real.length}</div><div class="l">Anfragen</div></div><div class="kpi k2"><div class="v">${open}</div><div class="l">offen</div></div><div class="kpi"><div class="v">${fmtDur(avg)}</div><div class="l">Ø erste Antwort</div></div><div class="kpi k4"><div class="v">${pct(booked)} %</div><div class="l">gebucht</div></div></div>
  <div class="cards">
   <div class="card"><h3>Welches Studio wird angefragt</h3><div class="split"><i style="flex:${p};background:var(--primary)"></i><i style="flex:${f};background:var(--ai)"></i><i style="flex:${x};background:var(--line)"></i></div>
    <div class="legend"><div><span class="lg" style="background:var(--primary)"></span>Penthouse Loft<span class="num">${p} · ${pct(p)} %</span></div><div><span class="lg" style="background:var(--ai)"></span>Factory Loft<span class="num">${f} · ${pct(f)} %</span></div><div><span class="lg" style="background:var(--line)"></span>Nicht festgelegt<span class="num">${x} · ${pct(x)} %</span></div></div></div>
   <div class="card"><h3>Was angefragt wird</h3>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${k}</span><span class="track"><i style="width:${v/cmax*100}%"></i></span><span class="num">${v}</span></div>`).join('')}</div>
   <div class="card"><h3>Status</h3>${Object.keys(stc).map(s=>{const n=real.filter(t=>t.status===s).length;return `<div class="bar"><span>${ST_LABEL[s]}</span><span class="track"><i style="width:${n/real.length*100}%;background:${stc[s]}"></i></span><span class="num">${n}</span></div>`}).join('')}</div>
   <div class="card"><h3>Erste Antwort</h3>${buckets.map(([l,a,b,c])=>{const n=resp.filter(t=>t.resp>=a&&t.resp<b).length;return `<div class="bar"><span>${l}</span><span class="track"><i style="width:${n/resp.length*100}%;background:${c}"></i></span><span class="num">${n}</span></div>`}).join('')}</div>
   <div class="card" style="grid-column:1/-1"><h3>Prioritäts-Regeln</h3><ul class="rules"><li>Termin in den nächsten 7 Tagen<b class="hot">Dringend</b></li><li>Rückfrage zu bestehender Buchung<b class="hot">Dringend</b></li><li>Stammkunde erkannt<b style="color:var(--violet)">Lila</b></li><li>Werbung, SEO, gefälschte Mahnungen<b class="hot">Spam</b></li><li>Länger als 12 h ohne Antwort<b style="color:var(--orange)">Warnung</b></li><li>Angebot 3 Tage ohne Rückmeldung<b style="color:var(--primary)">Nachfassen</b></li></ul></div>
  </div></div>`;
}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400);}
function scrollMsgs(){const ms=document.getElementById('dscroll');if(ms)ms.scrollTop=ms.scrollHeight;}
function scrollTop(){const ms=document.getElementById('dscroll');if(ms)ms.scrollTop=0;}
function customerReplies(t,f){
  t.typing=false;t.step=(t.step||0)+1;if(f===GENERIC)t.genericDone=true;
  const at=tick(11);t.msgs.push({d:'in',t:at,x:f.x});t.at=at;t.summary=f.sum;drafts[t.id]=null;variantIdx=0;
  if(f.req)t.req=f.req;
  if(f.final){t.status=f.final.status;if(f.final.color!==undefined)t.color=f.final.color;syncBookingOnFinal(t);}else t.status='offen';
  if(currentId!==t.id)t.unread=true;
  toast(`Neue Antwort von ${first(t)}${t.status==='gebucht'?' · gebucht':''}`);
  if(view==='inbox'&&!sheet){render();scrollMsgs();}
}
function newInquiry(){
  const n=NEW[newIdx%NEW.length];newIdx++;const at=tick(9);
  const t={id:nextId++,name:n.name,email:n.email,subject:n.subject,studio:n.studio,cat:n.cat,prio:n.prio,color:n.color||null,status:n.cat==='Spam'?'spam':'offen',req:n.req,spam:n.spam,star:false,unread:true,at,summary:n.summary,sig:n.sig||n.name,msgs:[{d:'in',t:at,x:n.x}]};
  threads.push(t);
  toast(t.status==='spam'?`Spam erkannt (${n.spam} %) und aussortiert`:`Neue Anfrage · ${STUDIO[t.studio]} · ${t.cat}${t.prio==='hoch'?' · Dringend':''}`);
  render();
}
function openThread(id){currentId=id;variantIdx=0;threads.find(x=>x.id===id).unread=false;document.body.classList.add('open');render();scrollTop();}
document.addEventListener('click',e=>{
  if(e.target.id==='scrim'){sheet=null;render();return;}
  const b=e.target.closest('button'); if(!b) return;
  if(calClick(b)) return;
  if(contactsClick(b)) return;
  if(setClick(b)) return;
  const t=threads.find(x=>x.id===currentId);
  if(b.dataset.view){view=b.dataset.view;sheet=null;if(view!=='contacts'){document.body.classList.remove('copen');}render();return;}
  if(b.dataset.f){filter=b.dataset.f;page=0;render();return;}
  if(b.id==='selmode'){selMode=!selMode;selected.clear();render();return;}
  if(b.dataset.sel){const id=+b.dataset.sel;selected.has(id)?selected.delete(id):selected.add(id);renderList();return;}
  if(b.id==='selall'){const ids=[...document.querySelectorAll('[data-sel]')].map(x=>+x.dataset.sel);const all=ids.every(i=>selected.has(i));ids.forEach(i=>all?selected.delete(i):selected.add(i));renderList();return;}
  if(b.id==='selevery'){const q=query.trim();const pool=q.startsWith('@')?askAnswer(q).res:q?baseList().filter(t=>tokens(q).every(k=>hay(t).includes(k))):baseList().filter(statusF()).filter(TFIL[tfil].f);pool.forEach(t=>selected.add(t.id));renderList();return;}
  if(b.dataset.bulk){const k=b.dataset.bulk,n=selected.size;selected.forEach(id=>{const t=threads.find(x=>x.id===id);if(!t)return;if(k==='spam'){t.status='spam';t.spam=t.spamRisk||100;}else if(k==='nospam'){if(t.status==='spam')t.status='offen';t.spamRisk=0;}else t.status=k;});selected.clear();selMode=false;toast(`${n} ${n===1?'Anfrage':'Anfragen'}: ${{offen:'als offen markiert',abgeschlossen:'erledigt',spam:'in Spam verschoben',nospam:'kein Spam'}[k]}`);render();return;}
  if(b.dataset.ps){pageSize=+b.dataset.ps;page=0;renderList();return;}
  if(b.dataset.pg){page=Math.max(0,page+ +b.dataset.pg);renderList();document.getElementById('rows').scrollTop=0;return;}
  if(b.dataset.tf){tfil=tfil===b.dataset.tf?'alle':b.dataset.tf;page=0;render();return;}
  if(b.dataset.ask){query=b.dataset.ask;page=0;render();return;}
  if(b.id==='clr'){query='';render();return;}
  if(b.id==='newinq'){newInquiry();return;}
  if(b.id==='openfilter'){sheet='filter';render();return;}
  if(b.dataset.flt){const k=b.dataset.flt,v=k==='range'?+b.dataset.val:b.dataset.val;flt[k]=flt[k]===v?null:v;render();return;}
  if(b.id==='resetflt'){flt={studio:null,cat:null,color:null,range:null};render();return;}
  if(b.id==='closesheet'){sheet=null;render();return;}
  if(b.dataset.id){sheet=null;openThread(+b.dataset.id);return;}
  if(b.id==='back'){document.body.classList.remove('open');render();return;}
  if(!t) return;
  if(b.dataset.mv){mailView=b.dataset.mv;render();return;}
  if(b.dataset.exp){expanded[b.dataset.exp]=true;render();return;}
  if(b.dataset.q){quoteOpen[b.dataset.q]=!quoteOpen[b.dataset.q];const s=document.getElementById('dscroll').scrollTop;render();document.getElementById('dscroll').scrollTop=s;return;}
  if(b.id==='more'){sheet='more';render();return;}
  if(b.id==='openatt'){sheet='attach';pick=[...(attach[t.id]||[])];render();return;}
  if(b.dataset.tab){sheetTab=b.dataset.tab;render();return;}
  if(b.dataset.pick){const id=b.dataset.pick;pick=pick.includes(id)?pick.filter(x=>x!==id):[...pick,id];render();return;}
  if(b.id==='applyatt'){attach[t.id]=pick;sheet=null;keepDraft();render();return;}
  if(b.dataset.addatt){attach[t.id]=[...(attach[t.id]||[]),b.dataset.addatt];keepDraft();render();return;}
  if(b.dataset.rm){attach[t.id]=(attach[t.id]||[]).filter(x=>x!==b.dataset.rm);keepDraft();render();return;}
  if(b.dataset.c){t.color=b.dataset.c==='none'?null:b.dataset.c;render();return;}
  if(b.dataset.s){t.studio=b.dataset.s;render();return;}
  if(b.dataset.p){t.prio=b.dataset.p;render();return;}
  if(b.id==='star'){t.star=!t.star;render();return;}
  if(b.id==='done'){t.status=t.status==='abgeschlossen'?'offen':'abgeschlossen';sheet=null;toast(t.status==='abgeschlossen'?'Abgeschlossen':'Wieder geöffnet');render();return;}
  if(b.id==='spam'){t.status=t.status==='spam'?'offen':'spam';t.spam=t.spam||100;sheet=null;toast(t.status==='spam'?'Als Spam markiert':'Zurück in Anfragen');render();return;}
  if(b.dataset.v!=null){variantIdx=+b.dataset.v;drafts[t.id]=draftsFor(t)[variantIdx][1];render();return;}
  if(b.dataset.i){const ta=document.getElementById('draft');drafts[t.id]=improve(b.dataset.i,ta.value);ta.value=drafts[t.id];return;}
  if(b.id==='send'){const txt=document.getElementById('draft').value.trim();if(!txt){toast('Die Antwort ist leer.');return;}
    const sentAt=tick(4), att=(attach[t.id]||[]).map(docName);
    t.msgs.push({d:'out',t:sentAt,x:txt,att:att.length?att:undefined});attach[t.id]=[];
    if(t.status==='offen'){t.status='beantwortet';t.resp=t.resp||Math.max(1,Math.round((sentAt-lastIn(t).t)/6e4));}
    if(t.color==='rot')t.color='orange';t.at=sentAt;drafts[t.id]=null;variantIdx=0;
    toast('Gesendet · Demo, keine echte E-Mail');
    const list=FOLLOW[t.id]||[], f=list[t.step||0]||(t.genericDone?null:GENERIC);
    if(f){t.typing=true;setTimeout(()=>customerReplies(t,f),2600);}
    render();scrollMsgs();}
});
function keepDraft(){const ta=document.getElementById('draft');if(ta)drafts[currentId]=ta.value;}
document.addEventListener('input',e=>{
  if(e.target.id==='draft')drafts[currentId]=e.target.value;
  if(e.target.id==='q'){query=e.target.value;page=0;document.getElementById('rows').innerHTML=rowsHTML();document.getElementById('asks').hidden=!!query;document.getElementById('clr').hidden=!query;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){sheet=null;render();}});
if(matchMedia('(min-width:761px)').matches) currentId=1;
render();
</script>
