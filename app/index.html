<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b4fe0">
<title>Loft Inbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f3f4f8;--surface:#fff;--sunk:#eceef4;--line:#e2e4ec;--ink:#151826;--mute:#7c8196;--soft:#4a4f63;--primary:#2b4fe0;--primary-soft:#e8edff;--on-primary:#fff;--ai:#6d3fd6;--ai-soft:#f1ebff;--red:#e5484d;--red-soft:#fdecec;--orange:#e08a00;--orange-soft:#fff3dc;--green:#1f9d5c;--green-soft:#e3f6eb;--grey-soft:#eceef4;--bubble-out:#2b4fe0;--on-out:#fff;--font:"Geist",system-ui,-apple-system,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;--g:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--surface:#171a22;--sunk:#20232d;--line:#2a2e3a;--ink:#eceef4;--mute:#8a8fa3;--soft:#b6bacb;--primary:#6f8cff;--primary-soft:#1e2647;--on-primary:#0f1117;--ai-soft:#251d3d;--red-soft:#3a1d20;--orange-soft:#3a2c12;--green-soft:#15322a;--grey-soft:#262a35;--bubble-out:#2f45a8;color-scheme:dark}}
*{box-sizing:border-box}html,body,#root{height:100%}
body{margin:0;overflow-x:hidden;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
.center{min-height:100%;display:grid;place-items:center;padding:24px var(--gr) 24px var(--g)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;font-size:18px}
h1{font-size:24px;letter-spacing:-.02em;margin:0}
.sub{color:var(--mute);font-size:13.5px;margin:0}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--soft)}
input,textarea{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 12px;font-size:16px;width:100%;max-width:100%}
.btn{height:44px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:600;padding:0 18px}
.btn.sec{background:var(--sunk);color:var(--ink)}
.btn:disabled{opacity:.5}
.err{color:var(--red);font-size:13.5px;min-height:1em;margin:0}
.qr{background:#fff;border-radius:12px;padding:10px;align-self:center}
.qr img{display:block;width:180px;height:180px}
.code{font:13px var(--mono);word-break:break-all;background:var(--sunk);padding:8px 10px;border-radius:8px}
/* App */
.app{height:100%;display:grid;grid-template-columns:380px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px var(--gr) 10px var(--g);background:var(--surface);border-bottom:1px solid var(--line)}
.top .logo{width:32px;height:32px;font-size:15px;border-radius:9px}
.top b{font-size:16px}.top .sp{flex:1}
.tab{height:34px;padding:0 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--soft)}
.tab[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.list{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px var(--gr) 12px var(--g);border-bottom:1px solid var(--line);scrollbar-width:none}
.chip{flex:none;height:30px;padding:0 12px;border-radius:99px;background:var(--sunk);font-size:13px;font-weight:500;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.rows{flex:1;overflow-y:auto}
.row{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;width:100%;text-align:left;padding:12px var(--gr) 12px var(--g);border-bottom:1px solid var(--line)}
.row[aria-current="true"]{background:var(--primary-soft)}
.row.closed{opacity:.5}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px}
.rc{min-width:0;display:flex;flex-direction:column;gap:2px}
.r1{display:flex;gap:8px;align-items:baseline}.r1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row.unread .r1 b{font-weight:700}
.r1 time{font:12px var(--mono);color:var(--mute)}
.r2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft);font-size:14px}
.st{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;align-self:flex-start;margin-top:3px}
.st-offen{background:var(--orange-soft);color:var(--orange)}.st-beantwortet{background:var(--primary-soft);color:var(--primary)}.st-gebucht{background:var(--green-soft);color:var(--green)}.st-abgeschlossen{background:var(--grey-soft);color:var(--mute)}.st-spam{background:var(--red-soft);color:var(--red)}
.detail{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.dh{display:flex;align-items:center;gap:8px;padding:12px var(--gr) 12px var(--g);background:var(--surface);border-bottom:1px solid var(--line)}
.dh .t{flex:1;min-width:0}.dh .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dh .t small{color:var(--mute);font-size:12.5px}
.back{display:none;width:36px;height:36px;border-radius:10px;font-size:20px}
.mini{height:32px;padding:0 11px;border-radius:9px;background:var(--sunk);font-size:12.5px;font-weight:600;white-space:nowrap}
.scroll{flex:1;overflow-y:auto;padding:18px var(--gr) 24px var(--g)}
.inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.inner{min-width:0}.inner h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}
.mail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.mail.out{background:var(--primary-soft);border-color:transparent}
.mail.first{box-shadow:inset 3px 0 0 var(--primary)}
.mh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;min-width:0}
.mh b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mh time{margin-left:auto;font:12px var(--mono);color:var(--mute);flex:none}
.mtag{font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:1px 7px;flex:none}
.mb{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-size:15px;line-height:1.55}
.composer{background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gr) calc(12px + env(safe-area-inset-bottom,0px)) var(--g)}
.composer .inner{gap:8px}
.composer textarea{min-height:100px;max-height:35vh;resize:vertical}
.cbar{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.cbar small{color:var(--mute);margin-right:auto;font-size:12px}
.empty{margin:auto;text-align:center;color:var(--mute);padding:40px 24px}
.settings{grid-column:1/-1;overflow-y:auto;padding:20px var(--gr) 32px var(--g)}
.settings .inner{max-width:640px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sc h3{margin:0;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;flex-wrap:wrap}.kv span{color:var(--mute)}
.ok{color:var(--green);font-weight:600}.bad{color:var(--red);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.top .logo,.top b{display:none}.top{justify-content:flex-end}body.open .top{display:none}body.open .app{grid-template-rows:minmax(0,1fr)}body.open .list{display:none}body:not(.open) .detail{display:none}.back{display:grid;place-items:center}.list{border-right:0}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const toast = (t) => { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (e.hidden = true), 3000); };
const ST = { offen: 'Offen', beantwortet: 'Wartet auf Kunde', gebucht: 'Gebucht', abgeschlossen: 'Abgeschlossen', spam: 'Spam' };
const FILTERS = [['offen', 'Offen', (t) => t.status === 'offen'], ['alle', 'Alle', (t) => t.status !== 'spam'], ['wartet', 'Wartet', (t) => t.status === 'beantwortet'], ['erledigt', 'Abgeschlossen', (t) => t.status === 'abgeschlossen'], ['spam', 'Spam', (t) => t.status === 'spam']];
const AV = ['#2b4fe0', '#d6409f', '#1f9d5c', '#e08a00', '#8e4ec6', '#0e9bb5', '#e5484d'];
const avatar = (n) => { const c = AV[[...n].reduce((a, ch) => a + ch.charCodeAt(0), 0) % AV.length]; return `<span class="av" style="background:color-mix(in srgb,${c} 16%,var(--surface));color:${c}">${esc(n.split(/[\s@.]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase())}</span>`; };
const fmtT = (iso) => { const d = new Date(iso), n = new Date(); return d.toDateString() === n.toDateString() ? d.toTimeString().slice(0, 5) : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }); };
const fmtFull = (iso) => new Date(iso).toLocaleString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

let sb, threads = [], current = null, msgs = [], filter = 'offen', view = 'anfragen';

async function api(path, body) {
  const { data } = await sb.auth.getSession();
  const r = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { authorization: 'Bearer ' + data.session.access_token, 'content-type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Fehler ' + r.status);
  return j;
}

// ---------- Anmeldung ----------
function loginView(msg = '') {
  $('#root').innerHTML = `<div class="center"><form class="card" id="login"><div class="logo">L</div><h1>Loft Inbox</h1><p class="sub">Anmelden</p>
  <label>E-Mail<input id="email" type="email" autocomplete="username" required></label>
  <label>Passwort<input id="pw" type="password" autocomplete="current-password" required></label>
  <p class="err" id="err">${esc(msg)}</p><button class="btn" id="go">Anmelden</button></form></div>`;
  $('#login').onsubmit = async (e) => {
    e.preventDefault(); $('#go').disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pw').value });
    if (error) { $('#err').textContent = 'Anmeldung fehlgeschlagen. E-Mail oder Passwort stimmen nicht.'; $('#go').disabled = false; return; }
    route();
  };
}
async function mfaView() {
  const { data: f } = await sb.auth.mfa.listFactors();
  const verified = (f?.totp || []).find((x) => x.status === 'verified');
  let factorId = verified?.id, setup = '';
  if (!verified) {
    for (const x of f?.totp || []) await sb.auth.mfa.unenroll({ factorId: x.id });
    const { data, error } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Authenticator ' + new Date().toISOString().slice(0, 10) });
    if (error) return loginView('Zweiter Faktor konnte nicht eingerichtet werden: ' + error.message);
    factorId = data.id;
    setup = `<p class="sub">Einmalig: Scanne den Code mit deiner Authenticator-App (z. B. 1Password, Google Authenticator).</p><div class="qr"><img alt="QR-Code" src="${data.totp.qr_code}"></div><p class="sub">Oder Schlüssel manuell eingeben:</p><div class="code">${esc(data.totp.secret)}</div>`;
  }
  $('#root').innerHTML = `<div class="center"><form class="card" id="mfa"><div class="logo">L</div><h1>Zweiter Faktor</h1>${setup}
  <label>6-stelliger Code aus der App<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
  <p class="err" id="err"></p><button class="btn" id="go">Bestätigen</button><button type="button" class="btn sec" id="out">Abmelden</button></form></div>`;
  $('#code').focus();
  $('#out').onclick = async () => { await sb.auth.signOut(); loginView(); };
  $('#mfa').onsubmit = async (e) => {
    e.preventDefault(); $('#go').disabled = true;
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId, code: $('#code').value.trim() });
    if (error) { $('#err').textContent = 'Code falsch oder abgelaufen. Bitte den aktuellen Code eingeben.'; $('#go').disabled = false; return; }
    route();
  };
}
async function route() {
  const { data: s } = await sb.auth.getSession();
  if (!s.session) return loginView();
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.currentLevel !== 'aal2') return mfaView();
  appView();
}

// ---------- App ----------
function appView() {
  view = location.hash.startsWith('#einstellungen') ? 'einstellungen' : 'anfragen';
  $('#root').innerHTML = `<div class="app"><header class="top"><span class="logo">L</span><b>Loft Inbox</b><span class="sp"></span>
   <button class="tab" data-view="anfragen" ${view === 'anfragen' ? 'aria-current="page"' : ''}>Anfragen</button><button class="tab" data-view="einstellungen" ${view === 'einstellungen' ? 'aria-current="page"' : ''}>Einstellungen</button></header>
   ${view === 'anfragen' ? `<aside class="list"><div class="chips" id="chips"></div><div class="rows" id="rows"><div class="empty">Lade …</div></div></aside><section class="detail" id="detail"><div class="empty">Anfrage auswählen</div></section>` : `<section class="settings" id="settings"><div class="inner"><div class="empty">Lade …</div></div></section>`}</div>`;
  document.querySelectorAll('[data-view]').forEach((b) => (b.onclick = () => { location.hash = b.dataset.view; appView(); }));
  if (view === 'anfragen') loadThreads(); else loadSettings();
}
async function loadThreads() {
  const { data, error } = await sb.from('threads').select('id,subject,status,unread,last_message_at,contacts(name,email)').order('last_message_at', { ascending: false }).limit(300);
  if (error) { $('#rows').innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  threads = data; renderList();
}
function renderList() {
  $('#chips').innerHTML = FILTERS.map(([k, l, f]) => `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${l} ${threads.filter(f).length}</button>`).join('');
  document.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { filter = b.dataset.f; renderList(); }));
  const list = threads.filter(FILTERS.find((x) => x[0] === filter)[2]);
  $('#rows').innerHTML = list.length ? list.map((t) => { const n = t.contacts?.name || t.contacts?.email || '?'; return `<button class="row ${t.unread ? 'unread' : ''} ${t.status === 'abgeschlossen' ? 'closed' : ''}" data-id="${t.id}" aria-current="${current?.id === t.id}">${avatar(n)}<span class="rc"><span class="r1"><b>${esc(n)}</b><time>${fmtT(t.last_message_at)}</time></span><span class="r2">${esc(t.subject)}</span><span class="st st-${t.status}">${ST[t.status]}</span></span></button>`; }).join('') : `<div class="empty">Hier ist gerade nichts.${threads.length ? '' : '<br>Verbinde Microsoft in den Einstellungen.'}</div>`;
  document.querySelectorAll('.row').forEach((b) => (b.onclick = () => openThread(b.dataset.id)));
}
async function openThread(id) {
  current = threads.find((t) => t.id === id); document.body.classList.add('open'); renderList();
  const { data } = await sb.from('messages').select('id,direction,from_addr,body_text,sent_at').eq('thread_id', id).order('sent_at');
  msgs = data || [];
  if (current.unread) { await sb.from('threads').update({ unread: false }).eq('id', id); current.unread = false; renderList(); }
  renderDetail();
}
function renderDetail() {
  const t = current, n = t.contacts?.name || t.contacts?.email;
  const closed = t.status === 'abgeschlossen' || t.status === 'spam';
  $('#detail').innerHTML = `<header class="dh"><button class="back" id="back" aria-label="Zurück">‹</button><div class="t"><b>${esc(n)}</b><small>${esc(t.contacts?.email || '')}</small></div>
   <button class="mini" id="done">${t.status === 'abgeschlossen' ? 'Wieder öffnen' : 'Erledigt'}</button><button class="mini" id="spam">${t.status === 'spam' ? 'Kein Spam' : 'Spam'}</button></header>
   <div class="scroll" id="scroll"><div class="inner"><h2>${esc(t.subject)}</h2><span class="st st-${t.status}">${ST[t.status]}</span>
   ${msgs.map((m, i) => `<article class="mail ${m.direction} ${i === msgs.findIndex((x) => x.direction === 'in') ? 'first' : ''}"><div class="mh"><b>${m.direction === 'in' ? esc(n) : 'Du · Loft Studio Cologne'}</b>${i === msgs.findIndex((x) => x.direction === 'in') ? '<span class="mtag">Erstanfrage</span>' : ''}<time>${fmtFull(m.sent_at)}</time></div><div class="mb">${esc(m.body_text)}</div></article>`).join('')}</div></div>
   ${closed ? '' : `<footer class="composer"><div class="inner"><textarea id="reply" placeholder="Antwort schreiben … (KI-Vorschläge kommen in Phase 3)"></textarea><div class="cbar"><small>Von mail@loftstudiocologne.com</small><button class="btn" id="send">Senden</button></div></div></footer>`}`;
  $('#scroll').scrollTop = 1e9;
  $('#back').onclick = () => { document.body.classList.remove('open'); current = null; renderList(); };
  $('#done').onclick = () => setStatus(t.status === 'abgeschlossen' ? 'offen' : 'abgeschlossen');
  $('#spam').onclick = () => setStatus(t.status === 'spam' ? 'offen' : 'spam');
  if ($('#send')) $('#send').onclick = sendReply;
}
async function setStatus(s) {
  const { error } = await sb.from('threads').update({ status: s }).eq('id', current.id);
  if (error) return toast(error.message);
  current.status = s; renderList(); renderDetail(); toast({ abgeschlossen: 'Erledigt', spam: 'Als Spam markiert', offen: 'Wieder offen' }[s]);
}
async function sendReply() {
  const body = $('#reply').value.trim(); if (!body) return toast('Die Antwort ist leer.');
  $('#send').disabled = true; $('#send').textContent = 'Sende …';
  try { await api('/api/send', { threadId: current.id, body }); toast('Gesendet'); await loadThreads(); current = threads.find((t) => t.id === current.id) || current; await openThread(current.id); }
  catch (e) { toast(e.message); $('#send').disabled = false; $('#send').textContent = 'Senden'; }
}
async function loadSettings() {
  const q = new URLSearchParams(location.hash.split('?')[1] || '');
  if (q.get('ms') === 'ok') toast('Microsoft verbunden'); else if (q.get('ms') === 'fehler') toast('Microsoft: ' + (q.get('grund') || 'Fehler'));
  let s; try { s = await api('/api/status'); } catch (e) { s = { error: e.message }; }
  const { data: u } = await sb.auth.getUser();
  $('#settings').innerHTML = `<div class="inner"><h1>Einstellungen</h1>
  <div class="sc"><h3>Postfach</h3>${s.error ? `<p class="bad">${esc(s.error)}</p>` : s.microsoft ? `<div class="kv"><span>Microsoft</span><b class="ok">Verbunden: ${esc(s.microsoft.account)}</b></div>` : `<div class="kv"><span>Microsoft</span><b class="bad">Nicht verbunden</b></div>`}
   <div class="kv"><span>Letzter Abruf</span><b>${s.lastRun ? fmtFull(s.lastRun.at) : 'noch keiner'}</b></div>
   ${s.lastError && (!s.lastRun || s.lastError.at > s.lastRun.at) ? `<div class="kv"><span>Letzter Fehler</span><b class="bad">${esc(s.lastError.message)}</b></div>` : ''}
   <div class="cbar"><button class="btn sec" id="sync" ${s.microsoft ? '' : 'disabled'}>Jetzt abrufen</button><button class="btn" id="ms">${s.microsoft ? 'Neu verbinden' : 'Mit Microsoft verbinden'}</button></div>
   <p class="sub">Bei der Microsoft-Anmeldung bitte mit mail@loftstudiocologne.com anmelden.</p></div>
  <div class="sc"><h3>Konto</h3><div class="kv"><span>Angemeldet als</span><b>${esc(u.user?.email)}</b></div><div class="cbar"><button class="btn sec" id="logout">Abmelden</button></div></div></div>`;
  $('#ms').onclick = async () => { try { const { url } = await api('/api/ms/start', {}); location.href = url; } catch (e) { toast(e.message); } };
  $('#sync').onclick = async () => { const b = $('#sync'); b.disabled = true; b.textContent = 'Abruf läuft …'; try { const r = await api('/api/sync', {}); const n = r.result.inbox.neu + r.result.sentitems.neu; const done = r.result.inbox.fertig && r.result.sentitems.fertig; toast(`${n} neue Nachrichten geholt.` + (done ? ' Alles abgerufen.' : ' Es gibt noch mehr, der Rest folgt automatisch alle 5 Minuten.')); loadSettings(); } catch (e) { toast('Abruf: ' + e.message); b.disabled = false; b.textContent = 'Jetzt abrufen'; } };
  $('#logout').onclick = async () => { await sb.auth.signOut(); location.hash = ''; loginView(); };
}

(async () => {
  try {
    const cfg = await (await fetch('/api/config')).json();
    if (!cfg.supabaseKey) throw new Error('SUPABASE_PUBLISHABLE_KEY fehlt in Netlify');
    sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
    route();
    setInterval(() => { if (view === 'anfragen' && $('#rows') && !document.hidden) loadThreads(); }, 60000);
  } catch (e) { $('#root').innerHTML = `<div class="center"><div class="card"><div class="logo">L</div><h1>Loft Inbox</h1><p class="err">Einrichtung unvollständig: ${esc(e.message)}</p></div></div>`; }
})();
</script>
</body>
</html>
