<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b4fe0">
<title>Loft Inbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>

/* Layout: Desktop = Leiste | Liste | Verlauf. Mobil = eine Ansicht, Tabs unten. Kobaltblau als Leitfarbe, Violett für alles, was die KI macht. */
:root{
  --bg:#f3f4f8;--surface:#ffffff;--sunk:#eceef4;--line:#e2e4ec;--ink:#151826;--mute:#7c8196;--soft:#4a4f63;
  --primary:#2b4fe0;--primary-soft:#e8edff;--on-primary:#ffffff;
  --ai:#6d3fd6;--ai-soft:#f1ebff;--ai-line:#ddd0fb;
  --bubble-out:#2b4fe0;--on-out:#ffffff;
  --red:#e5484d;--red-soft:#fdecec;--orange:#e08a00;--orange-soft:#fff3dc;--green:#1f9d5c;--green-soft:#e3f6eb;
  --blue:#2b4fe0;--violet:#8e4ec6;--grey-soft:#eceef4;
  --font:"Geist",system-ui,-apple-system,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
  --r:14px;--g:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1117;--surface:#171a22;--sunk:#20232d;--line:#2a2e3a;--ink:#eceef4;--mute:#8a8fa3;--soft:#b6bacb;
  --primary:#6f8cff;--primary-soft:#1e2647;--on-primary:#0f1117;--ai:#b79bff;--ai-soft:#251d3d;--ai-line:#3b2f63;
  --bubble-out:#2f45a8;--on-out:#ffffff;--red-soft:#3a1d20;--orange-soft:#3a2c12;--green-soft:#15322a;--grey-soft:#262a35;--blue:#6f8cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--surface:#171a22;--sunk:#20232d;--line:#2a2e3a;--ink:#eceef4;--mute:#8a8fa3;--soft:#b6bacb;
  --primary:#6f8cff;--primary-soft:#1e2647;--on-primary:#0f1117;--ai:#b79bff;--ai-soft:#251d3d;--ai-line:#3b2f63;
  --bubble-out:#2f45a8;--on-out:#ffffff;--red-soft:#3a1d20;--orange-soft:#3a2c12;--green-soft:#15322a;--grey-soft:#262a35;--blue:#6f8cff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);margin:0;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
mark{background:#ffe27a;color:#151826;border-radius:3px;padding:0 1px}
.app{height:100%;display:grid;grid-template-columns:76px 380px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}

/* Navigation */
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;border-right:1px solid var(--line);background:var(--surface)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;margin-bottom:14px}
.nav{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:8px 0;border-radius:12px;color:var(--mute);font-size:11px;font-weight:500}
.nav svg{width:22px;height:22px}
.nav[aria-current="page"]{color:var(--primary);background:var(--primary-soft)}
.nav .cnt{position:absolute;top:3px;right:9px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:600 10px/17px var(--font);padding:0 4px}

/* Liste */
.list{background:var(--surface);border-right:1px solid var(--line)}
.lh{display:flex;align-items:flex-end;gap:12px;padding:18px var(--gr) 10px var(--g)}
.lh h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.lh p{margin:3px 0 0;color:var(--mute);font-size:13px}
.lh .sp{flex:1}
.hot{color:var(--red);font-weight:600}
.ghost{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap;background:var(--surface)}
.search{padding:0 var(--gr) 10px var(--g);display:flex;gap:8px}
.sbox{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--sunk);border:1px solid transparent}
.sbox:focus-within{border-color:var(--primary);background:var(--surface)}
.sbox svg{width:18px;height:18px;color:var(--mute);flex:none}
.sbox input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.sbox input::placeholder{color:var(--mute)}
.sbox .clr{color:var(--mute);font-size:18px;line-height:1;width:24px}
.fbtn{position:relative;width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;color:var(--soft);flex:none}
.fbtn svg{width:18px;height:18px}
.fbtn.on{background:var(--primary-soft);color:var(--primary)}
.fbtn .cnt{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--primary);color:var(--on-primary);font:600 10px/17px var(--font)}
.asks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 var(--gr) 10px var(--g)}
.asks::-webkit-scrollbar{display:none}
.asks button{flex:none;height:30px;padding:0 11px;border-radius:99px;background:var(--ai-soft);color:var(--ai);font-size:12.5px;font-weight:500;white-space:nowrap}
.filters{display:flex;gap:6px;overflow-x:auto;padding:0 var(--gr) 12px var(--g);scrollbar-width:none;border-bottom:1px solid var(--line)}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;border-radius:99px;background:var(--sunk);font-size:13px;font-weight:500;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.chip .n{font:12px var(--mono);margin-left:5px;opacity:.65}
.rows{flex:1;overflow-y:auto;overscroll-behavior:contain}
.answer{margin:12px var(--gr) 4px var(--g);background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:var(--r);padding:12px 14px;font-size:14px}
.answer .ah{display:flex;align-items:center;gap:6px;color:var(--ai);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.answer .ah svg{width:14px;height:14px}
.answer p{margin:0 0 6px}
.answer .src{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.answer .src button{height:28px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--ai-line);font-size:12.5px;color:var(--ai);font-weight:500}
.rcount{padding:10px var(--gr) 2px var(--g);font-size:12px;color:var(--mute)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;width:100%;text-align:left;padding:13px var(--gr) 13px var(--g);border-bottom:1px solid var(--line)}
.row[aria-current="true"]{background:var(--primary-soft)}
.av{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.av .mk{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--c);border:2.5px solid var(--surface)}
.row[aria-current="true"] .av .mk{border-color:var(--primary-soft)}
.rc{min-width:0;display:flex;flex-direction:column;gap:2px}
.r1{display:flex;gap:8px;align-items:baseline}
.r1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row.unread .r1 b{font-weight:700}
.r1 time{font:12px var(--mono);color:var(--mute);flex:none}
.row.unread .r1 time{color:var(--primary);font-weight:500}
.r2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft);font-size:14px}
.row.unread .r2{color:var(--ink);font-weight:500}
.r2s{font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r3{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);min-width:0;overflow:hidden;white-space:nowrap;margin-top:3px}
.st{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;flex:none}
.st-offen{background:var(--orange-soft);color:var(--orange)}
.st-beantwortet{background:var(--primary-soft);color:var(--primary)}
.st-gebucht{background:var(--green-soft);color:var(--green)}
.st-abgeschlossen{background:var(--grey-soft);color:var(--mute)}
.st-spam{background:var(--red-soft);color:var(--red)}
.st-hot{background:var(--red-soft);color:var(--red)}
.star{color:var(--orange)}
.empty{margin:auto;text-align:center;color:var(--mute);padding:40px 24px;max-width:340px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* Verlauf */
.detail{background:var(--bg)}
.dh{display:flex;align-items:center;gap:6px;padding:10px var(--gr) 10px var(--g);background:var(--surface);border-bottom:1px solid var(--line);min-height:60px}
.icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--soft)}
.icon:hover{background:var(--sunk)}
.icon svg{width:20px;height:20px}
.icon.star-on{color:var(--orange)}
.icon.done-on{color:var(--green)}
.back{display:none}
.dh .av{width:36px;height:36px;font-size:13px}
.dh-t{flex:1;min-width:0;margin-left:4px}
.dh-t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh-t small{display:block;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dscroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px var(--gr) 24px var(--g)}
.dinner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.dinner h2{font-size:21px;font-weight:650;letter-spacing:-.015em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--soft)}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sum{background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:var(--r);padding:14px 16px;font-size:15px;line-height:1.5}
.sum .ah{display:flex;align-items:center;gap:6px;color:var(--ai);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.sum .ah svg{width:15px;height:15px}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.vbar span{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.seg{display:flex;gap:2px;background:var(--sunk);border-radius:10px;padding:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:28px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--soft);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.1)}
.msgs{display:flex;flex-direction:column;gap:10px}
/* Chat */
.bub{max-width:min(540px,88%);padding:10px 14px;border-radius:18px;white-space:pre-wrap;font-size:14.5px;overflow-wrap:anywhere}
.bub.in{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.bub.out{background:var(--bubble-out);color:var(--on-out);align-self:flex-end;border-bottom-right-radius:6px}
.bub small{display:block;font:11px var(--mono);opacity:.6;margin-top:5px}
.typing{color:var(--mute)}
.typing i{animation:blink 1.2s infinite;font-style:normal}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
/* E-Mail */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mail.first{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.mhead{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px}
.mhead .av{width:34px;height:34px;font-size:12px}
.mmeta{flex:1;min-width:0}
.mmeta .n{display:flex;gap:8px;align-items:baseline}
.mmeta .n b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mmeta .n time{margin-left:auto;font:12px var(--mono);color:var(--mute);flex:none}
.mmeta .to{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mmeta .pv{font-size:13.5px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.tagfirst{display:inline-block;font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:1px 7px;margin-top:4px}
.mbody{padding:0 14px 14px 58px;white-space:pre-wrap;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.msig{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--mute);white-space:pre-wrap}
.qbtn{margin-top:10px;height:22px;padding:0 8px;border-radius:6px;background:var(--sunk);color:var(--mute);font-size:12px;letter-spacing:.1em}
.quote{margin-top:8px;padding:6px 0 6px 12px;border-left:3px solid var(--line);color:var(--mute);font-size:13px;white-space:pre-wrap}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.att{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;background:var(--sunk);font-size:12.5px;color:var(--soft);max-width:100%}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .ic{flex:none;font:600 9.5px var(--mono);background:var(--red);color:#fff;border-radius:3px;padding:1px 4px}
.att .ic.img{background:var(--green)}
.bub .att{background:rgb(255 255 255/.16);color:inherit}

/* Antwort */
.composer{background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gr) 12px var(--g)}
.cinner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ctop{display:flex;align-items:center;gap:8px;min-width:0}
.ailbl{font-size:12px;color:var(--ai);font-weight:600;flex:none;display:flex;align-items:center;gap:4px}
.ailbl svg{width:14px;height:14px}
.ctop .seg{background:var(--ai-soft)}
.ctop .seg button{color:var(--ai)}
.ctop .seg button[aria-pressed="true"]{color:var(--ink)}
.src-note{font-size:11.5px;color:var(--mute);margin-left:auto;flex:none}
textarea{width:100%;min-height:110px;max-height:32vh;resize:vertical;font-size:14.5px;line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink)}
.catt{display:flex;flex-wrap:wrap;gap:6px}
.catt .att button{color:var(--mute);font-size:15px;line-height:1;margin-left:2px}
.sugg{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px dashed var(--ai-line);color:var(--ai);font-size:12.5px;font-weight:500}
.cbar{display:flex;align-items:center;gap:8px;min-width:0}
.clip{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--soft)}
.clip svg{width:19px;height:19px}
.refine{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.refine::-webkit-scrollbar{display:none}
.refine button{flex:none;height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;color:var(--soft);white-space:nowrap}
.send{flex:none;height:38px;padding:0 18px;border-radius:11px;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:14px}
.closed{display:flex;align-items:center;gap:12px;justify-content:space-between;color:var(--soft);font-size:14px;flex-wrap:wrap}

/* Statistik */
.stats{grid-column:2/4;overflow-y:auto;padding:20px var(--gr) 32px var(--g)}
.sinner{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.stats h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--mute);font-size:13px;margin:-8px 0 4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--mute);margin-top:4px}
.kpi.k1 .v{color:var(--primary)}.kpi.k2 .v{color:var(--orange)}.kpi.k4 .v{color:var(--green)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:13.5px;font-weight:600;margin:0 0 12px}
.bar{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 2em;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.bar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.num{font:12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .num{margin-left:auto}
.lg{width:9px;height:9px;border-radius:3px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--soft)}
.rules li{display:flex;gap:10px;justify-content:space-between}
.rules b{font-weight:600;flex:none}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgb(10 12 20/.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:10px var(--gr) calc(20px + env(safe-area-inset-bottom,0px)) var(--g);display:flex;flex-direction:column;gap:6px;max-height:88vh;overflow-y:auto}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sheet h2{font-size:18px;margin:0 0 4px}
.sheet h3{font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:10px;background:var(--sunk);font-size:14px}
.opt[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
.opt .d{width:9px;height:9px;border-radius:50%;background:var(--c)}
.sbtn{margin-top:14px;height:44px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-weight:600}
.sbtn.danger{background:var(--red-soft);color:var(--red)}
.sbtn.sec{background:var(--sunk);color:var(--ink);margin-top:6px}
.doclist{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sunk);text-align:left;width:100%}
.doc[aria-pressed="true"]{background:var(--primary-soft);box-shadow:inset 0 0 0 1.5px var(--primary)}
.doc .ic{flex:none;width:34px;height:42px;border-radius:5px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:end center;padding-bottom:5px;font:600 9px var(--mono);color:var(--red)}
.doc b{display:block;font-size:14px;font-weight:500;overflow-wrap:anywhere}
.doc small{display:block;font-size:12px;color:var(--mute)}
.doc .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--on-primary);font-size:12px;flex:none}

/* Kalender */
:root{--sP:#2b4fe0;--sF:#0e9bb5}

.cal{grid-column:2/4;overflow-y:auto;padding:20px var(--gr) 32px var(--g)}
.cinner2{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px 20px;align-items:start}
.calh,.calbar{grid-column:1/-1}
.calh h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.sync{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:12.5px;margin:4px 0 0}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mnav{display:flex;align-items:center;gap:4px}
.mnav b{font-size:17px;font-weight:600;min-width:9.5em;text-align:center;text-transform:capitalize}

.calwrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;min-width:0}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11.5px;font-weight:600;color:var(--mute);text-align:center;padding:4px 0 6px;letter-spacing:.04em}
.cd{min-height:92px;border-radius:12px;padding:7px 6px 6px;display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--bg);min-width:0;transition:background .15s}
.cd:hover{background:var(--sunk)}
.cd.pad{background:none}
.cd.we{background:color-mix(in srgb,var(--bg) 60%,var(--sunk))}
.cd.past{opacity:.45}

.cd.today .dn{background:var(--primary);color:var(--on-primary)}
.cd.sel{background:var(--primary-soft);box-shadow:inset 0 0 0 1.5px var(--primary)}
.bars{display:flex;flex-direction:column;gap:3px;margin-top:auto;min-width:0}
.cb{display:block;height:18px;border-radius:5px;font-size:10.5px;line-height:18px;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.cb em{font-style:normal;font-weight:500}
.cb.free{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cb.gebucht.sP{background:var(--sP);color:#fff}.cb.gebucht.sF{background:var(--sF);color:#fff}
.cb.reserviert.sP{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--sP) 22%,var(--surface)) 0 5px,color-mix(in srgb,var(--sP) 10%,var(--surface)) 5px 10px);color:var(--sP);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sP) 45%,transparent)}
.cb.reserviert.sF{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--sF) 22%,var(--surface)) 0 5px,color-mix(in srgb,var(--sF) 10%,var(--surface)) 5px 10px);color:var(--sF);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sF) 45%,transparent)}
.cb.block{background:repeating-linear-gradient(45deg,var(--sunk) 0 4px,var(--line) 4px 8px);color:var(--mute)}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--soft);margin-top:12px;padding:0 4px}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.lgb{display:inline-block;width:18px;height:10px;border-radius:3px}

.lgb.blk{background:repeating-linear-gradient(45deg,var(--sunk) 0 3px,var(--line) 3px 6px)}
.calside{display:flex;flex-direction:column;gap:14px;min-width:0}
.dayd,.agenda{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}

/* Verfügbarkeit im Verlauf */
.avail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}

<body data-view="auth">

<div id="pop"></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== Loft Inbox: echte App =====
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const toast = (t) => { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (e.hidden = true), 3000); };
const I = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  star: (on) => `<svg viewBox="0 0 24 24" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>`,
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>',
  filter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  neu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="8"/></svg>',
  woche: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  alt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4.5" rx="1.2"/><path d="M5 8.5V18a2 2 0 002 2h10a2 2 0 002-2V8.5M10 12.5h4"/></svg>',
};
const COLORS = { rot: 'var(--red)', orange: 'var(--orange)', gruen: 'var(--green)', blau: 'var(--blue)', lila: 'var(--violet)' };
const COLOR_NAMES = { rot: 'Dringend', orange: 'Angebot offen', gruen: 'Zugesagt', blau: 'Info', lila: 'Stammkunde' };
const STUDIO = { P: 'Penthouse Loft', F: 'Factory Loft', X: 'Studio offen' };
const CATS = ['Verfügbarkeit', 'Preis', 'Besichtigung', 'Buchung', 'Workshop / Seminar', 'Event', 'Ausstattung', 'Sonstiges'];
const ST_LABEL = { offen: 'Offen', beantwortet: 'Wartet auf Kunde', gebucht: 'Gebucht', abgeschlossen: 'Abgeschlossen', spam: 'Spam' };
const AV = ['#2b4fe0', '#d6409f', '#1f9d5c', '#e08a00', '#8e4ec6', '#0e9bb5', '#e5484d'];
const MAILBOX = 'mail@loftstudiocologne.com';

let sb, threads = [], current = null, msgs = [], view = 'inbox';
let filter = 'alle', tfil = 'alle', query = '', msgHits = null, page = 0, pageSize = 25;
let viewMode = {}, showImgs = {}, showQuote = {};
let selMode = false, selected = new Set(), sheet = null, drafts = {}, expanded = {}, settings = { theme: 'system' };
try { const ps = JSON.parse(localStorage.getItem('li-prefs') || '{}'); if (ps.pageSize) pageSize = ps.pageSize; if (ps.theme) settings.theme = ps.theme; } catch (e) {}
const savePrefs = () => { try { localStorage.setItem('li-prefs', JSON.stringify({ pageSize, theme: settings.theme })); } catch (e) {} };
const applyTheme = () => { const r = document.documentElement; settings.theme === 'system' ? r.removeAttribute('data-theme') : r.setAttribute('data-theme', settings.theme); };
applyTheme();

const ini = (n) => n.split(/[\s@.]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const avc = (n) => AV[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % AV.length];
const avatar = (t, mk = true) => { const c = avc(t.name); return `<span class="av" style="background:color-mix(in srgb,${c} 16%,var(--surface));color:${c}">${esc(ini(t.name))}${mk && t.color ? `<span class="mk" style="--c:${COLORS[t.color]}"></span>` : ''}</span>`; };
const stPill = (t) => `<span class="st st-${t.status}">${ST_LABEL[t.status]}</span>`;
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dayDiff = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return Math.round((today0() - x) / 864e5); };
const bucket = (t) => { const n = dayDiff(t.at); return n <= 0 ? [0, 'Heute'] : n === 1 ? [1, 'Gestern'] : n < 7 ? [2, 'Letzte 7 Tage'] : n < 31 ? [3, 'Letzte 30 Tage'] : [4, 'Älter']; };
const fmtT = (d) => (dayDiff(d) <= 0 ? d.toTimeString().slice(0, 5) : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: dayDiff(d) > 300 ? '2-digit' : undefined }));
const fmtFull = (d) => new Date(d).toLocaleString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
const waitingH = (t) => (t.status === 'offen' ? (Date.now() - t.at) / 36e5 : 0);
const sortKey = (t) => (t.prio === 'hoch' && t.status === 'offen' ? 0 : 1) * 1e13 + (t.status === 'offen' ? 0 : 1) * 1e12 - +t.at / 10;
const FILTERS = [
  ['alle', 'Alle', (t) => t.status !== 'spam'],
  ['offen', 'Offen', (t) => t.status === 'offen'],
  ['wichtig', 'Wichtig', (t) => t.star || (t.prio === 'hoch' && t.status === 'offen')],
  ['wartet', 'Wartet', (t) => t.status === 'beantwortet'],
  ['gebucht', 'Gebucht', (t) => t.status === 'gebucht'],
  ['abgeschlossen', 'Abgeschlossen', (t) => t.status === 'abgeschlossen'],
  ['spam', 'Spam', (t) => t.status === 'spam'],
];
const TFIL = { alle: { l: 'Alle', f: () => true }, neu: { l: 'Neu', f: (t) => t.unread || dayDiff(t.at) <= 1 }, woche: { l: '7 Tage', f: (t) => dayDiff(t.at) < 7 }, alt: { l: 'Älter', f: (t) => dayDiff(t.at) >= 7 } };
const statusF = () => FILTERS.find((x) => x[0] === filter)[2];

const fromDb = (r) => ({ id: r.id, subject: r.subject, status: r.status, unread: r.unread, star: r.starred, prio: r.priority, color: r.marker, studio: r.studio, cat: r.category, spam: r.spam_score, summary: r.summary, at: new Date(r.last_message_at), name: r.contacts?.name || r.contacts?.email || '?', email: r.contacts?.email || '' });
const DBF = { status: 'status', unread: 'unread', star: 'starred', prio: 'priority', color: 'marker', studio: 'studio', cat: 'category' };
async function patch(ts, fields) {
  const list = Array.isArray(ts) ? ts : [ts];
  const db = Object.fromEntries(Object.entries(fields).map(([k, v]) => [DBF[k], v]));
  list.forEach((t) => Object.assign(t, fields));
  const { error } = await sb.from('threads').update(db).in('id', list.map((t) => t.id));
  if (error) { toast('Speichern fehlgeschlagen: ' + error.message); await loadThreads(); }
}
async function api(path, body) {
  const { data } = await sb.auth.getSession();
  const r = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { authorization: 'Bearer ' + data.session.access_token, 'content-type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Fehler ' + r.status);
  return j;
}

// ---------- Anmeldung ----------
function authShell(inner) { document.body.dataset.view = 'auth'; $('#root').innerHTML = `<div class="center">${inner}</div>`; }
function loginView(msg = '') {
  authShell(`<form class="acard" id="login"><div class="logo">L</div><h1>Loft Inbox</h1><p class="sub">Anmelden</p>
  <label class="fl">E-Mail<input id="email" type="email" autocomplete="username" required></label>
  <label class="fl">Passwort<input id="pw" type="password" autocomplete="current-password" required></label>
  <p class="aerr" id="err">${esc(msg)}</p><button class="sbtn" id="go">Anmelden</button></form>`);
  $('#login').onsubmit = async (e) => {
    e.preventDefault(); $('#go').disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pw').value });
    if (error) { $('#err').textContent = 'Anmeldung fehlgeschlagen. E-Mail oder Passwort stimmen nicht.'; $('#go').disabled = false; return; }
    route();
  };
}
async function mfaView() {
  const { data: f } = await sb.auth.mfa.listFactors();
  const verified = (f?.totp || []).find((x) => x.status === 'verified');
  let factorId = verified?.id, setup = '';
  if (!verified) {
    for (const x of f?.totp || []) await sb.auth.mfa.unenroll({ factorId: x.id });
    const { data, error } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Authenticator ' + new Date().toISOString().slice(0, 10) });
    if (error) return loginView('Zweiter Faktor konnte nicht eingerichtet werden: ' + error.message);
    factorId = data.id;
    setup = `<p class="sub">Einmalig: Scanne den Code mit deiner Authenticator-App.</p><div class="qr"><img alt="QR-Code" src="${data.totp.qr_code}"></div><p class="sub">Oder Schlüssel manuell eingeben:</p><div class="code">${esc(data.totp.secret)}</div>`;
  }
  authShell(`<form class="acard" id="mfa"><div class="logo">L</div><h1>Zweiter Faktor</h1>${setup}
  <label class="fl">6-stelliger Code aus der App<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
  <p class="aerr" id="err"></p><button class="sbtn" id="go">Bestätigen</button><button type="button" class="sbtn sec" id="out">Abmelden</button></form>`);
  $('#code').focus();
  $('#out').onclick = async () => { await sb.auth.signOut(); loginView(); };
  $('#mfa').onsubmit = async (e) => {
    e.preventDefault(); $('#go').disabled = true;
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId, code: $('#code').value.trim() });
    if (error) { $('#err').textContent = 'Code falsch oder abgelaufen.'; $('#go').disabled = false; return; }
    route();
  };
}
async function route() {
  const { data: s } = await sb.auth.getSession();
  if (!s.session) return loginView();
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.currentLevel !== 'aal2') return mfaView();
  appShell();
}

// ---------- Grundgerüst ----------
function appShell() {
  $('#root').innerHTML = `<div class="app">
   <nav class="rail" aria-label="Bereiche"><div class="logo" aria-hidden="true">L</div>
    <button class="nav" data-view="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>Anfragen<span class="cnt" id="navcnt" hidden></span></button>
    <button class="nav" data-view="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Einstellungen</button>
   </nav>
   <aside class="pane list" id="list"></aside><section class="pane detail" id="detail"></section><section class="pane set" id="set"></section></div>`;
  view = location.hash.startsWith('#einstellungen') ? 'set' : 'inbox';
  render();
  loadThreads();
  sb.from('settings').select('theme').maybeSingle().then(({ data }) => { if (data?.theme && data.theme !== settings.theme) { settings.theme = data.theme; applyTheme(); savePrefs(); if (view === 'set') render(); } });
}
function render() {
  document.body.dataset.view = view;
  document.querySelectorAll('.nav').forEach((n) => (n.dataset.view === view ? n.setAttribute('aria-current', 'page') : n.removeAttribute('aria-current')));
  const oc = threads.filter((t) => t.status === 'offen').length, nc = $('#navcnt'); if (nc) { nc.textContent = oc; nc.hidden = !oc; }
  if (view === 'set') { document.body.classList.remove('open'); renderSettings(); }

});
// Antwortfeld per Griff vergrößern
// Zieh-Helfer: Zeiger festhalten (auch über eingebetteten Mails), Bewegung pro Bildschirm-Frame bündeln
function startDrag(e, el, onMove, onEnd) {
  e.preventDefault();
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
  document.body.classList.add('dragging');
  let raf = 0, last = e;
  const move = (ev) => { last = ev; if (!raf) raf = requestAnimationFrame(() => { raf = 0; onMove(last); }); };
  const up = () => { cancelAnimationFrame(raf); document.body.classList.remove('dragging'); el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); onEnd(); };
  el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
document.addEventListener('pointerdown', (e) => {
  const g = e.target.closest('#grip'); if (!g) return;
  const ta = $('#draft'); if (!ta) return;
  const y0 = e.clientY, h0 = ta.offsetHeight, maxH = Math.max(160, ($('#detail').clientHeight || 600) * 0.7);
  startDrag(e, g, (ev) => { composerH = Math.round(Math.min(maxH, Math.max(56, h0 + (y0 - ev.clientY)))); ta.style.height = composerH + 'px'; },
    () => { try { localStorage.setItem('li-composer-h', composerH); } catch (err) {} });
});
document.addEventListener('keydown', (e) => {
  if (e.target.id !== 'grip' || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
  const ta = $('#draft'); if (!ta) return; e.preventDefault();
  composerH = Math.max(56, Math.min(600, ta.offsetHeight + (e.key === 'ArrowUp' ? 40 : -40))); ta.style.height = composerH + 'px';
  try { localStorage.setItem('li-composer-h', composerH); } catch (err) {}
});


// ---------- Schnellzuweisung in der Liste ----------
function popHTML() {
  const t = rowPop && threads.find((x) => x.id === rowPop.id); if (!t) return '';
  const o = (attr, v, on, label, dot) => `<button class="opt sm" data-${attr}="${esc(v)}" aria-pressed="${on}">${dot ? `<span class="d" style="--c:${dot}"></span>` : ''}${esc(label)}</button>`;
  return `<div class="rpop" role="dialog" aria-label="Zuweisen" style="top:${rowPop.y}px;left:${rowPop.x}px">
   <b class="rpt">${esc(t.subject)}</b>
   <h3>Markierung</h3><div class="opts">${Object.keys(COLORS).map((c) => o('pc', c, t.color === c, COLOR_NAMES[c], COLORS[c])).join('')}${o('pc', 'none', !t.color, 'Keine')}</div>
   <h3>Status</h3><div class="opts">${Object.entries(ST_LABEL).map(([k, l]) => o('pst', k, t.status === k, l)).join('')}</div>
   <h3>Studio</h3><div class="opts">${o('pstu', 'P', t.studio === 'P', 'Penthouse')}${o('pstu', 'F', t.studio === 'F', 'Factory')}${o('pstu', 'X', t.studio === 'X', 'Offen')}</div>
   <h3>Art</h3><div class="opts">${CATS.map((c) => o('pcat', c, t.cat === c, c)).join('')}</div></div>`;
}
function renderPop() { $('#pop').innerHTML = popHTML(); }
function openPop(id, btn) {
  const r = btn.getBoundingClientRect(), w = Math.min(340, innerWidth - 24);
  const x = Math.max(12, Math.min(r.right - w, innerWidth - w - 12));
  const y = Math.min(r.bottom + 6, innerHeight - 420);
  rowPop = { id, x, y: Math.max(12, y) }; renderPop();
}
async function quickPatch(id, fields, msg) {
  const t = threads.find((x) => x.id === id); if (!t) return;
  await patch(t, fields); renderList(); if (current?.id === id) redrawDetail(); if (rowPop) renderPop(); if (msg) toast(msg);
}
// Listenbreite per Griff
let listW = 380; try { listW = +localStorage.getItem('li-list-w') || 380; } catch (e) {}
const applyListW = () => document.documentElement.style.setProperty('--listw', listW + 'px');
applyListW();
document.addEventListener('pointerdown', (e) => {
  const g = e.target.closest('#lgrip'); if (!g) return;
  const x0 = e.clientX, w0 = listW;
  document.body.classList.add('resizing');
  startDrag(e, g, (ev) => { listW = Math.round(Math.min(Math.max(280, w0 + ev.clientX - x0), Math.min(720, innerWidth - 420))); applyListW(); },
    () => { document.body.classList.remove('resizing'); try { localStorage.setItem('li-list-w', listW); } catch (err) {} });
});
document.addEventListener('keydown', (e) => {
  const row = e.target.closest?.('.row');
  if (row && (e.key === 'Enter' || e.key === ' ') && e.target === row) { e.preventDefault(); row.click(); }
  if (e.target.id === 'lgrip' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { listW = Math.min(720, Math.max(280, listW + (e.key === 'ArrowRight' ? 30 : -30))); applyListW(); try { localStorage.setItem('li-list-w', listW); } catch (err) {} }
  if (e.key === 'Escape' && rowPop) { rowPop = null; renderPop(); }
});

// ---------- Optionen ----------
function sheetHTML() {
  const t = current; if (sheet !== 'more' || !t) return '';
  const o = (attr, v, on, label, dot) => `<button class="opt" data-${attr}="${esc(v)}" aria-pressed="${on}">${dot ? `<span class="d" style="--c:${dot}"></span>` : ''}${esc(label)}</button>`;
  return `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="Anfrage bearbeiten"><div class="grab"></div><h2>Anfrage</h2>
   <h3>Markierung</h3><div class="opts">${Object.keys(COLORS).map((c) => o('c', c, t.color === c, COLOR_NAMES[c], COLORS[c])).join('')}${o('c', 'none', !t.color, 'Keine')}</div>
   <h3>Studio</h3><div class="opts">${o('s', 'P', t.studio === 'P', 'Penthouse')}${o('s', 'F', t.studio === 'F', 'Factory')}${o('s', 'X', t.studio === 'X', 'Nicht festgelegt')}</div>
   <h3>Art der Anfrage</h3><div class="opts">${CATS.map((c) => o('cat', c, t.cat === c, c)).join('')}</div>
   <h3>Priorität</h3><div class="opts">${['hoch', 'normal', 'niedrig'].map((p) => o('p', p, t.prio === p, p[0].toUpperCase() + p.slice(1))).join('')}</div>
   <h3>Status</h3><div class="opts">${Object.entries(ST_LABEL).filter(([k]) => k !== 'spam').map(([k, l]) => o('st', k, t.status === k, l)).join('')}</div>
   <button class="sbtn danger" id="spam" style="margin-top:12px">${t.status === 'spam' ? 'Kein Spam' : 'Als Spam markieren'}</button></div></div>`;
}

// ---------- Einstellungen ----------
async function renderSettings() {
  const el = $('#set');
  const th = (v) => `<button data-theme-set="${v}" aria-pressed="${settings.theme === v}">${{ light: 'Hell', dark: 'Dunkel', system: 'System' }[v]}</button>`;
  el.innerHTML = `<div class="sinner"><h1>Einstellungen</h1>
   <section class="scard"><h3>Darstellung</h3><div class="srow"><div class="stx"><b>Erscheinungsbild</b><small>System folgt der Einstellung deines Geräts</small></div><div class="seg">${th('light')}${th('dark')}${th('system')}</div></div></section>
   <section class="scard" id="mailcard"><h3>Postfach</h3><div class="srow"><div class="stx"><b>Lade Status …</b></div></div></section>
   <section class="scard"><h3>Konto</h3><div class="srow"><div class="stx"><b id="who">…</b><small>Angemeldet mit zweitem Faktor</small></div><button class="mini" id="logout">Abmelden</button></div></section>
   <p class="sub" style="margin:0">KI, Kalender, Kontakte und Statistik folgen in den nächsten Schritten.</p></div>`;
  sb.auth.getUser().then(({ data }) => { const w = $('#who'); if (w) w.textContent = data.user?.email || ''; });
  const q = new URLSearchParams(location.hash.split('?')[1] || '');
  if (q.get('ms') === 'ok') { toast('Microsoft verbunden'); history.replaceState(null, '', '#einstellungen'); }
  else if (q.get('ms') === 'fehler') { toast('Microsoft: ' + (q.get('grund') || 'Fehler')); history.replaceState(null, '', '#einstellungen'); }
  let s; try { s = await api('/api/status'); } catch (e) { s = { error: e.message }; }
  const mc = $('#mailcard'); if (!mc) return;
  const errNewer = s.lastError && (!s.lastRun || s.lastError.at > s.lastRun.at);
  mc.innerHTML = `<h3>Postfach</h3>
   <div class="srow"><div class="stx"><b>Microsoft 365</b><small>${s.error ? esc(s.error) : s.microsoft ? 'Verbunden mit ' + esc(s.microsoft.account) : 'Noch nicht verbunden'}</small></div><span class="cst ${s.microsoft ? 'ok' : 'todo'}">${s.microsoft ? 'Verbunden' : 'Einrichten'}</span><button class="mini" id="ms">${s.microsoft ? 'Neu verbinden' : 'Verbinden'}</button></div>
   <div class="srow"><div class="stx"><b>Letzter Abruf</b><small>${s.lastRun ? fmtFull(s.lastRun.at) + ' · automatisch alle 5 Minuten' : 'noch keiner'}</small></div><button class="mini" id="sync" ${s.microsoft ? '' : 'disabled'}>Jetzt abrufen</button></div>
   ${errNewer ? `<div class="srow"><div class="stx"><b class="hot">Letzter Fehler</b><small>${esc(s.lastError.message)}</small></div></div>` : ''}
   <div class="srow"><div class="stx"><b>Postfach bleibt unangetastet</b><small>Die App liest nur. Mail auf dem Mac und Freshdesk laufen unverändert weiter.</small></div></div>`;
}

// ---------- Klicks ----------
document.addEventListener('click', async (e) => {
  if (e.target.id === 'scrim') { sheet = null; render(); return; }
  const b = e.target.closest('button');
  if (rowPop && !e.target.closest('.rpop') && !(b && b.dataset.qmenu)) { rowPop = null; renderPop(); if (!b && !e.target.closest('.row')) return; }
  const row = e.target.closest('.row');
  if (row && !b) { if (row.dataset.sel) { const id = row.dataset.sel; selected.has(id) ? selected.delete(id) : selected.add(id); renderList(); } else if (row.dataset.id) openThread(row.dataset.id); return; }
  if (sendMenu && !(b && (b.id === 'sendmenu' || b.dataset.sendas))) { sendMenu = false; if (current) redrawDetail(); if (!b) return; }
  if (!b || !sb) return;
  const t = current;
  if (b.dataset.view) { view = b.dataset.view; sheet = null; history.replaceState(null, '', view === 'set' ? '#einstellungen' : '#'); render(); return; }
  if (b.dataset.f) { filter = b.dataset.f; page = 0; renderList(); return; }
  if (b.dataset.tf) { tfil = tfil === b.dataset.tf ? 'alle' : b.dataset.tf; page = 0; renderList(); return; }
  if (b.id === 'clr') { query = ''; msgHits = null; page = 0; renderList(); return; }
  if (b.id === 'selmode') { selMode = !selMode; selected.clear(); renderList(); return; }
  if (b.dataset.qstar) { const t2 = threads.find((x) => x.id === b.dataset.qstar); quickPatch(t2.id, { star: !t2.star }); return; }
  if (b.dataset.qdone) { const t2 = threads.find((x) => x.id === b.dataset.qdone); const st2 = t2.status === 'abgeschlossen' ? 'offen' : 'abgeschlossen'; quickPatch(t2.id, { status: st2 }, st2 === 'abgeschlossen' ? 'Erledigt' : 'Wieder offen'); return; }
  if (b.dataset.qmenu) { if (rowPop?.id === b.dataset.qmenu) { rowPop = null; renderPop(); } else openPop(b.dataset.qmenu, b); return; }
  if (rowPop && b.dataset.pc) { quickPatch(rowPop.id, { color: b.dataset.pc === 'none' ? null : b.dataset.pc }); return; }
  if (rowPop && b.dataset.pst) { quickPatch(rowPop.id, { status: b.dataset.pst }); return; }
  if (rowPop && b.dataset.pstu) { quickPatch(rowPop.id, { studio: b.dataset.pstu }); return; }
  if (rowPop && b.dataset.pcat) { const t2 = threads.find((x) => x.id === rowPop.id); quickPatch(rowPop.id, { cat: t2.cat === b.dataset.pcat ? null : b.dataset.pcat }); return; }
  if (b.dataset.sel) { const id = b.dataset.sel; selected.has(id) ? selected.delete(id) : selected.add(id); renderList(); return; }
  if (b.id === 'selall') { const ids = [...document.querySelectorAll('[data-sel]')].map((x) => x.dataset.sel); const all = ids.every((i) => selected.has(i)); ids.forEach((i) => (all ? selected.delete(i) : selected.add(i))); renderList(); return; }
  if (b.id === 'selevery') { baseList().forEach((x) => selected.add(x.id)); renderList(); return; }
  if (b.dataset.bulk) {
    const k = b.dataset.bulk, list = threads.filter((x) => selected.has(x.id)), n = list.length;
    await patch(list, k === 'nospam' ? { status: 'offen' } : { status: k });
    selected.clear(); selMode = false;
    toast(`${n} ${n === 1 ? 'Anfrage' : 'Anfragen'}: ${{ offen: 'als offen markiert', abgeschlossen: 'erledigt', spam: 'in Spam verschoben', nospam: 'kein Spam' }[k]}`);
    render(); return;
  }
  if (b.dataset.ps) { pageSize = +b.dataset.ps; page = 0; savePrefs(); renderList(); return; }
  if (b.dataset.pg) { page = Math.max(0, page + +b.dataset.pg); renderList(); $('#rows').scrollTop = 0; return; }
  if (b.dataset.id) { openThread(b.dataset.id); return; }
  if (b.id === 'closethr') { current = null; sheet = null; sendMenu = false; document.body.classList.remove('open'); render(); return; }
  if (b.id === 'back') { document.body.classList.remove('open'); current = null; render(); return; }
  if (b.dataset.themeSet) { settings.theme = b.dataset.themeSet; applyTheme(); savePrefs(); renderSettings(); sb.from('settings').update({ theme: settings.theme }).eq('id', true).then(() => {}); return; }
  if (b.id === 'ms') { try { const { url } = await api('/api/ms/start', {}); location.href = url; } catch (err) { toast(err.message); } return; }
  if (b.id === 'sync') { b.disabled = true; b.textContent = 'Abruf läuft …'; try { const r = await api('/api/sync', {}); const n = r.result.inbox.neu + r.result.sentitems.neu; toast(`${n} neue Nachrichten.` + (r.result.inbox.fertig && r.result.sentitems.fertig ? ' Alles abgerufen.' : ' Der Rest folgt automatisch.')); loadThreads(); renderSettings(); } catch (err) { toast('Abruf: ' + err.message); b.disabled = false; b.textContent = 'Jetzt abrufen'; } return; }
  if (b.id === 'logout') { await sb.auth.signOut(); location.hash = ''; loginView(); return; }
  if (!t) return;
  if (b.dataset.copy) { const v = b.dataset.copy; try { await navigator.clipboard.writeText(v); toast('Kopiert'); } catch (err) { toast(v); } return; }
  if (b.dataset.vm) { const [id, m] = b.dataset.vm.split(':'); viewMode[id] = m; redrawDetail(); return; }
  if (b.dataset.imgs) { showImgs[b.dataset.imgs] = !showImgs[b.dataset.imgs]; redrawDetail(); return; }
  if (b.dataset.quote) { showQuote[b.dataset.quote] = !showQuote[b.dataset.quote]; redrawDetail(); return; }
  if (b.dataset.exp) { expanded[b.dataset.exp] = true; const s = $('#dscroll').scrollTop; $('#detail').innerHTML = detailHTML(); bindDetail(); $('#dscroll').scrollTop = s; return; }
  if (b.id === 'star') { await patch(t, { star: !t.star }); render(); return; }
  if (b.id === 'done') { await patch(t, { status: t.status === 'abgeschlossen' ? 'offen' : 'abgeschlossen' }); toast(t.status === 'abgeschlossen' ? 'Erledigt' : 'Wieder offen'); render(); return; }
  if (b.id === 'reopen') { await patch(t, { status: 'offen' }); render(); return; }
  if (b.id === 'more') { sheet = 'more'; render(); return; }
  if (b.dataset.c) { const v = b.dataset.c === 'none' || b.dataset.c === t.color ? null : b.dataset.c; await patch(t, { color: v }); if (sheet) render(); else { renderList(); redrawDetail(); } return; }
  if (b.dataset.s) { await patch(t, { studio: b.dataset.s }); render(); return; }
  if (b.dataset.cat) { await patch(t, { cat: t.cat === b.dataset.cat ? null : b.dataset.cat }); render(); return; }
  if (b.dataset.p) { await patch(t, { prio: b.dataset.p }); render(); return; }
  if (b.dataset.st) { await patch(t, { status: b.dataset.st }); render(); return; }
  if (b.id === 'spam') { await patch(t, { status: t.status === 'spam' ? 'offen' : 'spam' }); sheet = null; toast(t.status === 'spam' ? 'Als Spam markiert' : 'Zurück in Anfragen'); render(); return; }
  if (b.id === 'send') { sendReply('beantwortet'); return; }
  if (b.id === 'sendmenu') { sendMenu = !sendMenu; redrawDetail(); return; }
  if (b.dataset.sendas) { sendReply(b.dataset.sendas); return; }
  if (b.id === 'discard') { drafts[t.id] = ''; saveDrafts(); redrawDetail(); toast('Entwurf verworfen'); return; }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheet) { sheet = null; render(); } });

// ---------- Start ----------
if (location.hostname.startsWith('dev--')) { document.title = 'TEST · Loft Inbox'; const tb = document.createElement('div'); tb.className = 'testbadge'; tb.textContent = 'Test-Version'; document.body.appendChild(tb); }
(async () => {
  try {
    const cfg = await (await fetch('/api/config')).json();
    if (!cfg.supabaseKey) throw new Error('SUPABASE_PUBLISHABLE_KEY fehlt in Netlify');
    sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
    await route();
    setInterval(() => { if (document.body.dataset.view === 'inbox' && !document.hidden && !selMode) loadThreads(); }, 60000);
  } catch (e) { authShell(`<div class="acard"><div class="logo">L</div><h1>Loft Inbox</h1><p class="aerr">Einrichtung unvollständig: ${esc(e.message)}</p></div>`); }
})();
</script>
