<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Loft Inbox</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, sans-serif; background: #f3f4f8; color: #151826; }
  @media (prefers-color-scheme: dark) { body { background: #0f1117; color: #eceef4; } }
  main { text-align: center; padding: 24px; }
  b { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: #2b4fe0; color: #fff; font-size: 20px; margin-bottom: 12px; }
  p { color: #7c8196; margin: 4px 0 0; }
</style>
</head>
<body><main><b>L</b><h1 style="margin:0;font-size:22px">Loft Inbox</h1><p>Wird gerade eingerichtet.</p></main></body>
